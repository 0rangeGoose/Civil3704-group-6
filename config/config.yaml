# Inner Sydney Transit Projection Model configuration
# Bounding box, thresholds, endpoints, palette and poll intervals live here.
# Secrets (API keys) stay in .env, never here.

bounding_box:
  # WGS84. The physical model's surveyed footprint (NE/SW corners), taken
  # from the team's MODEL_CORNERS on group-repo/mid-project-demo: ~13.2km
  # E-W x 6.6km N-S. Changing this means rebuilding the static cache with
  # scripts/run_phase1.py, since that is filtered to the same box.
  north: -33.83512300658737
  south: -33.894722633376766
  west: 151.13296645445593
  east: 151.27599316594075

# Projector-pixel calibration, computed via the renderer's calibration mode
# (Phase 5) and persisted here so it survives restarts, per the brief.
calibration_path: "data/calibration.json"

static_gtfs:
  # Transport for NSW Open Data Hub product name.
  bundle_name: "timetables_complete_gtfs"
  # Verified 2026-08-19 against opendata.transport.nsw.gov.au dataset page.
  # GET this URL with the apikey header to download the combined zip.
  download_url: "https://api.transport.nsw.gov.au/v1/publictransport/timetables/complete/gtfs"
  # Refresh cadence: static data updates daily, never refetch on every start.
  refresh_interval_hours: 24
  cache_dir: "data/static_cache"
  raw_zip_path: "data/static_cache/raw_bundle.zip"
  db_path: "data/static_cache/gtfs_cbd.db"
  manifest_path: "data/static_cache/manifest.json"

realtime_gtfs:
  base_host: "https://api.transport.nsw.gov.au"
  poll_interval_seconds: 15
  # TfNSW rate-limits each API key (about 5 requests/second). Requests within
  # a poll cycle are spaced at least this far apart instead of fired in a
  # burst, which was getting a large share of them rejected with 429.
  min_request_interval_seconds: 0.3
  # Checked against opendata.transport.nsw.gov.au dataset/resource pages on
  # 2026-08-19. sydneytrains, metro and lightrail/innerwest were migrated to
  # v2 for trip_updates and vehicle_positions ("v1 ... superseded by v2" on
  # their resource pages); alerts is v2 across every mode, with a combined
  # /all path. Several resource pages sit behind a login wall so this
  # couldn't be confirmed against a live 200 -- the live source in
  # engine/sources/live.py logs and skips (not crashes on) any path that
  # 404s/403s, per the project brief, so a wrong guess here surfaces
  # immediately in logs rather than silently losing a mode.
  feeds:
    trip_updates:
      sydneytrains: "/v2/gtfs/realtime/sydneytrains"
      metro: "/v2/gtfs/realtime/metro"
      lightrail_innerwest: "/v2/gtfs/realtime/lightrail/innerwest"
      nswtrains: "/v1/gtfs/realtime/nswtrains"
      buses: "/v1/gtfs/realtime/buses"
      ferries: "/v1/gtfs/realtime/ferries/sydneyferries"
      lightrail_cbdandsoutheast: "/v1/gtfs/realtime/lightrail/cbdandsoutheast"
    vehicle_positions:
      sydneytrains: "/v2/gtfs/vehiclepos/sydneytrains"
      metro: "/v2/gtfs/vehiclepos/metro"
      lightrail_innerwest: "/v2/gtfs/vehiclepos/lightrail/innerwest"
      nswtrains: "/v1/gtfs/vehiclepos/nswtrains"
      buses: "/v1/gtfs/vehiclepos/buses"
      ferries: "/v1/gtfs/vehiclepos/ferries/sydneyferries"
      lightrail_cbdandsoutheast: "/v1/gtfs/vehiclepos/lightrail/cbdandsoutheast"
    # Only the combined feed: each alerts payload replaces the engine's whole
    # alert summary, so polling the per-mode feeds too meant the summary only
    # ever reflected whichever one arrived last. Per-mode paths, if needed:
    # /v2/gtfs/alerts/{sydneytrains,metro,lightrail,nswtrains,buses,ferries,regionbuses}
    service_alerts:
      all: "/v2/gtfs/alerts/all"
  # Bus trip IDs mutate under trip alteration; this many stale seconds past
  # poll_interval before a vehicle is treated as gone rather than just late.
  stale_after_seconds: 90

punctuality:
  # On time = no more than early_seconds early and no more than late_seconds
  # late (positive delay = late), per mode category. Sources:
  # - suburban_rail, intercity: TfNSW Sydney Trains / NSW TrainLink (Intercity)
  #   punctuality: within 5 / 6 minutes of the timetable at the final destination.
  # - bus: Greater Sydney Bus Contract, Schedule 4 (KPIs), 2023: departing no more
  #   than 59 s early and no more than 5 min 59 s late, measured at the first stop.
  # - metro, light_rail, ferry: no published definition found; TfNSW's Sydney
  #   Trains 5-minute standard applied by the project.
  # "very_late" is the project's own: past the limit AND later than the scheduled
  # gap to the next trip on the route (engine/normalise/headways.py).
  late_seconds:
    suburban_rail: 300
    intercity: 360
    metro: 300
    light_rail: 300
    bus: 359
    ferry: 300
  early_seconds:
    bus: 59

# How close a vehicle must be to an interchange's stop centroid to count
# towards its pulse intensity (Phase 6).
interchange_radius_m: 300

interchanges:
  - Central
  - Town Hall
  - Wynyard
  - Martin Place
  - Circular Quay
  - Barangaroo
  - Gadigal
  - Museum
  - St James

# The tablet controller reaches the server over the laptop's hotspot, so it
# listens on every interface, not just localhost. Anyone on the same network
# can open the controller -- use the hotspot, not venue/university Wi-Fi.
server:
  host: "0.0.0.0"
  port: 8765

# TfNSW's daily request quota for our API key: measured 25 Oct 2026, refused
# after 59,964 requests counted from midnight Sydney time, reset at midnight.
# Every process that polls shares one count (usage_path); outside the peak
# windows polling slows down to keep today's remaining peaks affordable.
# See engine/sources/budget.py.
api_budget:
  daily_limit: 57000          # ~5% under the measured quota, as a margin
  peaks:                      # weekdays, Sydney time: always polled at full rate
    - ["06:55", "09:05"]
    - ["16:25", "18:35"]
  max_interval_seconds: 600   # slowest pace when the budget is spent
  usage_path: "data/api_usage.json"
  heartbeat_path: "data/recordings/.server_polling"
