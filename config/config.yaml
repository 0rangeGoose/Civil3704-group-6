# Pulse CBD configuration
# Bounding box, thresholds, endpoints, palette and poll intervals live here.
# Secrets (API keys) stay in .env, never here.

bounding_box:
  # WGS84. Adjust after measuring the physical model.
  north: -33.8550
  south: -33.9000
  west: 151.1830
  east: 151.2262

# Projector-pixel calibration, computed via the renderer's calibration mode
# (Phase 5) and persisted here so it survives restarts, per the brief.
calibration_path: "data/calibration.json"

static_gtfs:
  # Transport for NSW Open Data Hub product name.
  bundle_name: "timetables_complete_gtfs"
  # Verified 2026-08-19 against opendata.transport.nsw.gov.au dataset page.
  # GET this URL with the apikey header to download the combined zip.
  download_url: "https://api.transport.nsw.gov.au/v1/publictransport/timetables/complete/gtfs"
  # Refresh cadence: static data updates daily, never refetch on every start.
  refresh_interval_hours: 24
  cache_dir: "data/static_cache"
  raw_zip_path: "data/static_cache/raw_bundle.zip"
  db_path: "data/static_cache/gtfs_cbd.db"
  manifest_path: "data/static_cache/manifest.json"

realtime_gtfs:
  base_host: "https://api.transport.nsw.gov.au"
  poll_interval_seconds: 15
  # Checked against opendata.transport.nsw.gov.au dataset/resource pages on
  # 2026-08-19. sydneytrains, metro and lightrail/innerwest were migrated to
  # v2 for trip_updates and vehicle_positions ("v1 ... superseded by v2" on
  # their resource pages); alerts is v2 across every mode, with a combined
  # /all path. Several resource pages sit behind a login wall so this
  # couldn't be confirmed against a live 200 -- the live source in
  # engine/sources/live.py logs and skips (not crashes on) any path that
  # 404s/403s, per the project brief, so a wrong guess here surfaces
  # immediately in logs rather than silently losing a mode. See
  # docs/DECISIONS.md.
  feeds:
    trip_updates:
      sydneytrains: "/v2/gtfs/realtime/sydneytrains"
      metro: "/v2/gtfs/realtime/metro"
      lightrail_innerwest: "/v2/gtfs/realtime/lightrail/innerwest"
      nswtrains: "/v1/gtfs/realtime/nswtrains"
      buses: "/v1/gtfs/realtime/buses"
      ferries: "/v1/gtfs/realtime/ferries/sydneyferries"
      lightrail_cbdandsoutheast: "/v1/gtfs/realtime/lightrail/cbdandsoutheast"
    vehicle_positions:
      sydneytrains: "/v2/gtfs/vehiclepos/sydneytrains"
      metro: "/v2/gtfs/vehiclepos/metro"
      lightrail_innerwest: "/v2/gtfs/vehiclepos/lightrail/innerwest"
      nswtrains: "/v1/gtfs/vehiclepos/nswtrains"
      buses: "/v1/gtfs/vehiclepos/buses"
      ferries: "/v1/gtfs/vehiclepos/ferries/sydneyferries"
      lightrail_cbdandsoutheast: "/v1/gtfs/vehiclepos/lightrail/cbdandsoutheast"
    service_alerts:
      all: "/v2/gtfs/alerts/all"
      sydneytrains: "/v2/gtfs/alerts/sydneytrains"
      metro: "/v2/gtfs/alerts/metro"
      lightrail: "/v2/gtfs/alerts/lightrail"
      nswtrains: "/v2/gtfs/alerts/nswtrains"
      buses: "/v2/gtfs/alerts/buses"
      ferries: "/v2/gtfs/alerts/ferries"
      regionbuses: "/v2/gtfs/alerts/regionbuses"
  # Bus trip IDs mutate under trip alteration; this many stale seconds past
  # poll_interval before a vehicle is treated as gone rather than just late.
  stale_after_seconds: 90

adherence_thresholds_seconds:
  # Positive means running late. suburban_rail/intercity/metro/light_rail
  # defaults are from the project brief; bus/ferry weren't specified there,
  # so 300s (5 min) was chosen to match the suburban_rail default -- see
  # docs/DECISIONS.md. Transport for NSW's own on-time definitions differ by
  # mode; these are this project's own simplified single-threshold model.
  suburban_rail: 300
  intercity: 360
  metro: 120
  light_rail: 120
  bus: 300
  ferry: 300
  # A trip beyond threshold * this multiplier is "very_late" rather than
  # just "late". Not specified in the brief -- see docs/DECISIONS.md.
  very_late_multiplier: 2

# How close a vehicle must be to an interchange's stop centroid to count
# towards its pulse intensity (Phase 6).
interchange_radius_m: 300

interchanges:
  - Central
  - Town Hall
  - Wynyard
  - Martin Place
  - Circular Quay
  - Barangaroo
  - Gadigal
  - Museum
  - St James
