[project]
name = "pulse-cbd"
version = "0.1.0"
description = "Live multimodal transit heartbeat for Sydney CBD, projected onto a physical model."
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "protobuf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "grpcio-tools>=1.60"]

[tool.pytest.ini_options]
testpaths = ["tests"]
