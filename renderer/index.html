<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Pulse CBD</title>
<style>
  /* Themeable via [data-theme] on <html> -- the canvas fill itself is driven
     from the matching CANVAS_THEME entry in JS (see below), since it's drawn
     per-frame rather than styled with CSS. Dark is the original "unlit model
     surface" default; light overrides it for on-screen viewing. */
  :root {
    --canvas-bg: #000;
    --status-text: #556; --status-bg: rgba(0,0,0,0.5);
    --panel-bg: rgba(10,14,22,0.9); --panel-border: #345; --panel-text: #cde;
    --panel-heading: #9cf; --panel-muted: #789; --panel-hint: #678;
    --input-bg: #112; --input-text: #cde; --input-border: #345;
    --button-bg: #234; --button-text: #cde; --button-border: #456; --button-hover-bg: #345;
    --error-color: #ff6b6b; --ok-color: #39ff6a;
  }
  :root[data-theme="light"] {
    --canvas-bg: #f4f6f8;
    --status-text: #4b5563; --status-bg: rgba(255,255,255,0.75);
    --panel-bg: rgba(255,255,255,0.95); --panel-border: #c7ccd4; --panel-text: #1f2328;
    --panel-heading: #0969da; --panel-muted: #59636e; --panel-hint: #6e7781;
    --input-bg: #ffffff; --input-text: #1f2328; --input-border: #c7ccd4;
    --button-bg: #eaeef2; --button-text: #1f2328; --button-border: #c7ccd4; --button-hover-bg: #d9dee3;
    --error-color: #cf222e; --ok-color: #1a7f37;
  }
  html, body { margin: 0; padding: 0; background: var(--canvas-bg); overflow: hidden; height: 100%; }
  canvas { display: block; }
  #status {
    position: fixed; top: 8px; left: 8px; z-index: 10;
    font: 11px/1.4 ui-monospace, monospace; color: var(--status-text);
    background: var(--status-bg); padding: 4px 8px; border-radius: 3px;
    pointer-events: none;
  }
  #calibration-panel {
    position: fixed; top: 8px; right: 8px; z-index: 10; width: 260px;
    font: 11px/1.5 ui-monospace, monospace; color: var(--panel-text);
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 4px;
    padding: 8px; display: none;
  }
  #calibration-panel.active { display: block; }
  #calibration-panel h3 { margin: 0 0 6px; font-size: 12px; color: var(--panel-heading); }
  #calibration-panel .point-row { display: flex; gap: 4px; margin-bottom: 4px; align-items: center; }
  #calibration-panel .point-row span { width: 14px; color: var(--panel-muted); }
  #calibration-panel input { width: 70px; background: var(--input-bg); color: var(--input-text); border: 1px solid var(--input-border); font: inherit; padding: 2px; }
  #calibration-panel button { font: inherit; background: var(--button-bg); color: var(--button-text); border: 1px solid var(--button-border); border-radius: 3px; padding: 4px 8px; margin-top: 4px; margin-right: 4px; cursor: pointer; }
  #calibration-panel button:hover { background: var(--button-hover-bg); }
  #calibration-panel .hint { color: var(--panel-hint); margin-top: 6px; }
  #cal-message { margin-top: 6px; min-height: 14px; }
  #cal-message.error { color: var(--error-color); }
  #cal-message.ok { color: var(--ok-color); }
</style>
</head>
<body>
<div id="status">connecting...</div>
<div id="calibration-panel">
  <h3>Calibration mode (press C to exit)</h3>
  <div id="calibration-points"></div>
  <button id="cal-add">+ point</button>
  <button id="cal-reset">reset</button>
  <button id="cal-save">save calibration</button>
  <div id="cal-message"></div>
  <div class="hint">Drag crosshairs to registration marks on the model, enter their known lat/lon, then save. Press V to toggle the verification overlay.</div>
</div>
<canvas id="canvas"></canvas>
<script>
"use strict";

// Colour encodes adherence state, tuned per theme so on_time still reads
// distinctly from late, which reads distinctly from very_late. The dark-mode
// palette is the brief's original -- bright on black, for projection onto a
// matte model. Those same hex values wash out on a light background, so
// light mode uses darker, more saturated variants for contrast instead.
const ADHERENCE_COLOR = {
  dark: {
    on_time: "#39ff6a", late: "#ffb020", very_late: "#c81c2e",
    cancelled: "#c81c2e", unknown: "#93a3b5",
  },
  light: {
    on_time: "#1a7f37", late: "#9a6700", very_late: "#cf222e",
    cancelled: "#cf222e", unknown: "#57606a",
  },
};

// Size/glow radius encodes mode, so heavy rail reads differently from a bus.
const MODE_RADIUS = {
  sydneytrains: 7, nswtrains: 7, metro: 7,
  lightrail_innerwest: 5.5, lightrail_cbdandsoutheast: 5.5,
  buses: 4, ferries: 4.5,
};
const DEFAULT_RADIUS = 4;

const TAIL_WINDOW_MS = 30000; // "last 30 seconds of travel"

// Canvas fill + corridor/interchange colours per theme -- kept in JS since
// these are drawn per-frame rather than styled with CSS. Shared with
// stats.html's control panel via the same localStorage key: toggling there
// updates this page live (see the "storage" listener below) without needing
// a reload, so a main-display tab and a stats tablet stay in sync.
const THEME_KEY = "pulse-cbd-theme";
const CANVAS_THEME = {
  dark: { bg: "#000", corridorDim: "rgba(220,228,238,0.55)", corridorBright: "rgba(255,255,255,0.95)", interchange: "#bfe8ff" },
  light: { bg: "#f4f6f8", corridorDim: "rgba(60,80,110,0.28)", corridorBright: "rgba(9,105,218,0.85)", interchange: "#0969da" },
};
let theme = "dark";

function applyTheme(nextTheme) {
  theme = nextTheme === "light" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", theme);
  if (shapes && projector) {
    corridorLayerDim = drawCorridorLayer(CANVAS_THEME[theme].corridorDim, 1);
    corridorLayerBright = drawCorridorLayer(CANVAS_THEME[theme].corridorBright, 1.6);
  }
}

window.addEventListener("storage", (ev) => {
  if (ev.key === THEME_KEY) applyTheme(ev.newValue || "dark");
});

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");

let cfg = null;
let shapes = null;
let calibration = null; // saved homography record from GET /calibration, or null
let corridorLayerDim = null;    // offscreen canvas, normal dim base layer
let corridorLayerBright = null; // offscreen canvas, verification-overlay brightness
let projector = null;

// vehicleKey -> { prev: {lat,lon,ts}, curr: {lat,lon,ts}, currReceivedAt: number,
//                 route_color, adherence, mode, history: [{lat,lon,ts}] }
const vehicles = new Map();

// [{name, lat, lon, count}, ...] -- "services passing through in the last
// few minutes" per interchange, from the same WS frame as vehicles.
let interchanges = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (cfg) {
    projector = selectProjector();
    corridorLayerDim = drawCorridorLayer(CANVAS_THEME[theme].corridorDim, 1);
    corridorLayerBright = drawCorridorLayer(CANVAS_THEME[theme].corridorBright, 1.6);
  }
}
window.addEventListener("resize", resize);

// A saved calibration (Phase 5) takes over from the flat-screen linear fit
// (Phase 4) the moment one exists -- the renderer's drawing code doesn't
// change either way, only which object satisfies project(lat, lon), per
// the brief's "structure the coordinate transform so a more sophisticated
// mapping could replace [it] later without touching the renderer's drawing
// code."
function selectProjector() {
  return calibration ? makeHomographyProjector(calibration) : makeProjector(cfg.bounding_box, canvas.width, canvas.height);
}

// Aspect-correct fit of the bounding box into the canvas: a naive
// lon/lat -> x/y stretch would visibly distort corridor shapes since the box
// isn't square (~5km N-S x 4km E-W). Longitude degrees are scaled by
// cos(latitude) so a metre is a metre in both directions.
function makeProjector(bbox, width, height) {
  const midLatRad = ((bbox.north + bbox.south) / 2) * Math.PI / 180;
  const lonScale = Math.cos(midLatRad);
  const spanX = (bbox.east - bbox.west) * lonScale;
  const spanY = (bbox.north - bbox.south);
  const scale = Math.min(width / spanX, height / spanY) * 0.94; // small margin
  const offsetX = (width - spanX * scale) / 2;
  const offsetY = (height - spanY * scale) / 2;
  return {
    project(lat, lon) {
      const x = (lon - bbox.west) * lonScale * scale + offsetX;
      const y = (bbox.north - lat) * scale + offsetY; // lat increases north; screen y increases down
      return [x, y];
    },
  };
}

// Same simple equirectangular-at-box-centre projection calibration.py uses
// to build the homography, reproduced here since the browser has no pyproj.
// Must match calibration.py's to_local_metric exactly -- see DECISIONS.md.
const DEG_TO_M = 111320.0;
function toLocalMetric(lat, lon, centerLat, centerLon) {
  const x = (lon - centerLon) * Math.cos(centerLat * Math.PI / 180) * DEG_TO_M;
  const y = (lat - centerLat) * DEG_TO_M;
  return [x, y];
}

function applyHomography(h, x, y) {
  const wx = h[0][0] * x + h[0][1] * y + h[0][2];
  const wy = h[1][0] * x + h[1][1] * y + h[1][2];
  const w  = h[2][0] * x + h[2][1] * y + h[2][2];
  return [wx / w, wy / w];
}

function makeHomographyProjector(calib) {
  return {
    project(lat, lon) {
      const [x, y] = toLocalMetric(lat, lon, calib.center_lat, calib.center_lon);
      return applyHomography(calib.homography, x, y);
    },
  };
}

function drawCorridorLayer(strokeStyle, lineWidth) {
  const off = document.createElement("canvas");
  off.width = canvas.width;
  off.height = canvas.height;
  const octx = off.getContext("2d");
  octx.strokeStyle = strokeStyle;
  octx.lineWidth = lineWidth;
  octx.lineJoin = "round";
  for (const shapeId in shapes) {
    const pts = shapes[shapeId];
    octx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const [x, y] = projector.project(pts[i][0], pts[i][1]);
      if (i === 0) octx.moveTo(x, y); else octx.lineTo(x, y);
    }
    octx.stroke();
  }
  return off;
}

function applyFrame(frameVehicles) {
  const seen = new Set();
  for (const v of frameVehicles) {
    seen.add(v.k);
    let entry = vehicles.get(v.k);
    if (!entry) {
      entry = { prev: null, curr: null, currReceivedAt: 0, history: [] };
      vehicles.set(v.k, entry);
    }
    entry.mode = v.m;
    entry.route_color = v.rc;
    entry.adherence = v.adh;

    const sample = { lat: v.lat, lon: v.lon, ts: v.ts };
    if (!entry.curr || entry.curr.ts !== sample.ts) {
      entry.prev = entry.curr;
      entry.curr = sample;
      entry.currReceivedAt = performance.now();
      entry.history.push(sample);
      const cutoff = (v.ts || 0) - TAIL_WINDOW_MS / 1000;
      entry.history = entry.history.filter((s) => (s.ts || 0) >= cutoff);
    }
  }
}

function lerp(a, b, t) { return a + (b - a) * t; }

function currentRenderPosition(entry, nowMs) {
  const pollMs = (cfg.poll_interval_seconds || 15) * 1000;
  if (!entry.curr) return null;
  if (!entry.prev) return [entry.curr.lat, entry.curr.lon, 0];
  const elapsed = nowMs - entry.currReceivedAt;
  const t = Math.max(0, Math.min(1, elapsed / pollMs)); // never extrapolate past one poll interval
  const lat = lerp(entry.prev.lat, entry.curr.lat, t);
  const lon = lerp(entry.prev.lon, entry.curr.lon, t);
  return [lat, lon, elapsed];
}

function render() {
  requestAnimationFrame(render);
  if (!projector || !corridorLayerDim) return;

  ctx.fillStyle = CANVAS_THEME[theme].bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(verificationMode ? corridorLayerBright : corridorLayerDim, 0, 0);

  drawInterchangePulses(performance.now());

  if (calibrateMode) drawCalibrationCrosshairs();

  const nowMs = performance.now();
  const staleMs = (cfg.stale_after_seconds || 90) * 1000;
  const pollMs = (cfg.poll_interval_seconds || 15) * 1000;
  const toDelete = [];

  for (const [key, entry] of vehicles) {
    const pos = currentRenderPosition(entry, nowMs);
    if (!pos) continue;
    const [lat, lon, elapsedSinceCurr] = pos;

    // Fade out once stale rather than freezing in place.
    let opacity = 1;
    if (elapsedSinceCurr > pollMs) {
      opacity = 1 - Math.min(1, (elapsedSinceCurr - pollMs) / (staleMs - pollMs));
    }
    if (opacity <= 0.02) { toDelete.push(key); continue; }

    const color = ADHERENCE_COLOR[theme][entry.adherence] || ADHERENCE_COLOR[theme].unknown;
    const radius = MODE_RADIUS[entry.mode] || DEFAULT_RADIUS;

    // Comet tail: the last ~30s of actual history plus the live interpolated point.
    const tailPts = entry.history.map((s) => projector.project(s.lat, s.lon));
    tailPts.push(projector.project(lat, lon));
    if (tailPts.length > 1) {
      for (let i = 1; i < tailPts.length; i++) {
        const tailT = i / (tailPts.length - 1);
        ctx.strokeStyle = withAlpha(color, tailT * 0.5 * opacity);
        ctx.lineWidth = Math.max(1, radius * 0.4);
        ctx.beginPath();
        ctx.moveTo(tailPts[i - 1][0], tailPts[i - 1][1]);
        ctx.lineTo(tailPts[i][0], tailPts[i][1]);
        ctx.stroke();
      }
    }

    const [x, y] = projector.project(lat, lon);

    // Solid dot -- no glow gradient.
    ctx.fillStyle = withAlpha(color, opacity);
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const key of toDelete) vehicles.delete(key);

  const modeFlags = [calibrateMode ? "CALIBRATING" : null, verificationMode ? "VERIFY" : null].filter(Boolean);
  statusEl.textContent = `pulse-cbd  |  ${vehicles.size} vehicles  |  ${wsStatus}` +
    (modeFlags.length ? `  |  ${modeFlags.join(" ")}` : "");
}

const INTERCHANGE_PULSE_PERIOD_MS = 2200;

// "Pulse the interchange nodes with an intensity proportional to services
// passing through them in the last few minutes" -- per the brief. A faint
// base ring always marks the interchange location; brightness/size scale
// with recent activity, breathing via a sine wave so a busy node reads as
// alive rather than a static blob.
function drawInterchangePulses(nowMs) {
  if (!interchanges.length) return;
  const phase = 0.5 + 0.5 * Math.sin((nowMs / INTERCHANGE_PULSE_PERIOD_MS) * 2 * Math.PI);
  const interchangeColor = CANVAS_THEME[theme].interchange;
  for (const ic of interchanges) {
    const [x, y] = projector.project(ic.lat, ic.lon);
    const activity = Math.min(1, Math.sqrt(ic.count) / 5); // sqrt so a handful of extra services doesn't dominate
    const baseRadius = 6 + activity * 22;
    const radius = baseRadius * (0.85 + 0.15 * phase);
    const coreAlpha = 0.15 + activity * 0.55 * (0.7 + 0.3 * phase);

    const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
    grad.addColorStop(0, withAlpha(interchangeColor, coreAlpha));
    grad.addColorStop(0.5, withAlpha(interchangeColor, coreAlpha * 0.35));
    grad.addColorStop(1, withAlpha(interchangeColor, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

function withAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${Math.max(0, Math.min(1, alpha))})`;
}

// --- Calibration mode (Phase 5) -------------------------------------------
// Draggable crosshairs recording (pixel_x, pixel_y) paired with a
// hand-entered (lat, lon) for each physical registration mark, per the
// brief. "Save calibration" POSTs the correspondences to the server, which
// computes the homography and persists it; the renderer then switches to
// using it via selectProjector().

let calibrateMode = false;
let verificationMode = false;
let calibrationPoints = []; // {lat, lon, pixel_x, pixel_y}, lat/lon nullable until entered
let draggingPointIndex = null;

function defaultCalibrationPoints() {
  const m = 0.1;
  // Right-side default x is pulled in past the calibration panel's width
  // (see #calibration-panel CSS) so a fresh crosshair doesn't spawn hidden
  // underneath it.
  const rightX = Math.min(canvas.width * (1 - m), canvas.width - 300);
  return [
    { lat: null, lon: null, pixel_x: canvas.width * m, pixel_y: canvas.height * m },
    { lat: null, lon: null, pixel_x: rightX, pixel_y: canvas.height * m },
    { lat: null, lon: null, pixel_x: canvas.width * m, pixel_y: canvas.height * (1 - m) },
    { lat: null, lon: null, pixel_x: rightX, pixel_y: canvas.height * (1 - m) },
  ];
}

function enterCalibrateMode() {
  calibrateMode = true;
  document.getElementById("calibration-panel").classList.add("active");
  if (calibration && calibration.points && calibration.points.length) {
    calibrationPoints = calibration.points.map((p) => ({ lat: p.lat, lon: p.lon, pixel_x: p.pixel_x, pixel_y: p.pixel_y }));
  } else if (calibrationPoints.length === 0) {
    calibrationPoints = defaultCalibrationPoints();
  }
  renderCalibrationPanel();
}

function exitCalibrateMode() {
  calibrateMode = false;
  document.getElementById("calibration-panel").classList.remove("active");
}

function renderCalibrationPanel() {
  const container = document.getElementById("calibration-points");
  container.innerHTML = "";
  calibrationPoints.forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "point-row";
    const label = document.createElement("span");
    label.textContent = String(i + 1);
    const latInput = document.createElement("input");
    latInput.type = "number"; latInput.step = "0.00001"; latInput.placeholder = "lat";
    latInput.value = p.lat ?? "";
    latInput.oninput = () => { p.lat = latInput.value === "" ? null : parseFloat(latInput.value); };
    const lonInput = document.createElement("input");
    lonInput.type = "number"; lonInput.step = "0.00001"; lonInput.placeholder = "lon";
    lonInput.value = p.lon ?? "";
    lonInput.oninput = () => { p.lon = lonInput.value === "" ? null : parseFloat(lonInput.value); };
    row.appendChild(label);
    row.appendChild(latInput);
    row.appendChild(lonInput);
    container.appendChild(row);
  });
}

function drawCalibrationCrosshairs() {
  calibrationPoints.forEach((p, i) => {
    const x = p.pixel_x, y = p.pixel_y;
    ctx.strokeStyle = i === draggingPointIndex ? "#ff2d9c" : "#5cf7ff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - 14, y); ctx.lineTo(x + 14, y);
    ctx.moveTo(x, y - 14); ctx.lineTo(x, y + 14);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, 14, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = "#5cf7ff";
    ctx.font = "11px ui-monospace, monospace";
    ctx.fillText(String(i + 1), x + 18, y - 10);
  });
}

function hitTestCalibrationPoint(x, y) {
  for (let i = calibrationPoints.length - 1; i >= 0; i--) {
    const p = calibrationPoints[i];
    if (Math.hypot(p.pixel_x - x, p.pixel_y - y) <= 16) return i;
  }
  return null;
}

canvas.addEventListener("mousedown", (ev) => {
  if (!calibrateMode) return;
  draggingPointIndex = hitTestCalibrationPoint(ev.offsetX, ev.offsetY);
});
canvas.addEventListener("mousemove", (ev) => {
  if (!calibrateMode || draggingPointIndex === null) return;
  calibrationPoints[draggingPointIndex].pixel_x = ev.offsetX;
  calibrationPoints[draggingPointIndex].pixel_y = ev.offsetY;
});
window.addEventListener("mouseup", () => { draggingPointIndex = null; });

document.getElementById("cal-add").addEventListener("click", () => {
  calibrationPoints.push({ lat: null, lon: null, pixel_x: canvas.width / 2, pixel_y: canvas.height / 2 });
  renderCalibrationPanel();
});
document.getElementById("cal-reset").addEventListener("click", () => {
  calibrationPoints = defaultCalibrationPoints();
  renderCalibrationPanel();
});
function showCalMessage(text, isError) {
  const el = document.getElementById("cal-message");
  el.textContent = text;
  el.className = isError ? "error" : "ok";
}

document.getElementById("cal-save").addEventListener("click", async () => {
  const valid = calibrationPoints.filter(
    (p) => p.lat !== null && p.lon !== null && !Number.isNaN(p.lat) && !Number.isNaN(p.lon)
  );
  if (valid.length < 4) {
    showCalMessage(`Need at least 4 points with lat/lon filled in (have ${valid.length}).`, true);
    return;
  }
  const resp = await fetch("/calibration", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ points: valid, canvas_width: canvas.width, canvas_height: canvas.height }),
  });
  const body = await resp.json();
  if (!resp.ok) {
    showCalMessage(`Calibration failed: ${body.error || resp.status}`, true);
    return;
  }
  calibration = body;
  projector = selectProjector();
  corridorLayerDim = drawCorridorLayer("rgba(70,95,135,0.35)", 1);
  corridorLayerBright = drawCorridorLayer("rgba(140,190,255,0.9)", 1.6);
  showCalMessage(`Calibration saved (${valid.length} points, ${body.computed_at}).`, false);
});

document.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "INPUT") return; // don't hijack typing lat/lon
  if (ev.key === "c" || ev.key === "C") {
    if (calibrateMode) exitCalibrateMode(); else enterCalibrateMode();
  } else if (ev.key === "v" || ev.key === "V") {
    verificationMode = !verificationMode;
  }
});

let wsStatus = "connecting...";

function connectWebSocket() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen = () => { wsStatus = "live"; };
  ws.onclose = () => { wsStatus = "reconnecting..."; setTimeout(connectWebSocket, 1000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    const frame = JSON.parse(ev.data);
    applyFrame(frame.vehicles);
    if (frame.interchanges) interchanges = frame.interchanges;
  };
}

async function boot() {
  applyTheme(localStorage.getItem(THEME_KEY) || "dark");
  const [cfgResp, shapesResp, calResp] = await Promise.all([
    fetch("/config"), fetch("/shapes"), fetch("/calibration"),
  ]);
  cfg = await cfgResp.json();
  shapes = await shapesResp.json();
  calibration = await calResp.json(); // null if none saved yet -- Phase 4's linear fit is used
  resize();
  connectWebSocket();
  requestAnimationFrame(render);
}

boot();
</script>
</body>
</html>
