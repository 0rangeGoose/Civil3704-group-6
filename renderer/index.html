<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Inner Sydney Transit Projection Model</title>
<style>
  /* Themeable via [data-theme] on <html> -- the canvas fill itself is driven
     from the matching CANVAS_THEME entry in JS (see below), since it's drawn
     per-frame rather than styled with CSS. Dark is the original "unlit model
     surface" default; light overrides it for on-screen viewing. */
  :root {
    --canvas-bg: #000;
    --status-text: #556; --status-bg: rgba(0,0,0,0.5);
    --panel-bg: rgba(10,14,22,0.9); --panel-border: #345; --panel-text: #cde;
    --panel-heading: #9cf; --panel-muted: #789; --panel-hint: #678;
    --input-bg: #112; --input-text: #cde; --input-border: #345;
    --button-bg: #234; --button-text: #cde; --button-border: #456; --button-hover-bg: #345;
    --error-color: #ff6b6b; --ok-color: #39ff6a;
  }
  :root[data-theme="light"] {
    --canvas-bg: #f4f6f8;
    --status-text: #4b5563; --status-bg: rgba(255,255,255,0.75);
    --panel-bg: rgba(255,255,255,0.95); --panel-border: #c7ccd4; --panel-text: #1f2328;
    --panel-heading: #0969da; --panel-muted: #59636e; --panel-hint: #6e7781;
    --input-bg: #ffffff; --input-text: #1f2328; --input-border: #c7ccd4;
    --button-bg: #eaeef2; --button-text: #1f2328; --button-border: #c7ccd4; --button-hover-bg: #d9dee3;
    --error-color: #cf222e; --ok-color: #1a7f37;
  }
  html, body { margin: 0; padding: 0; background: var(--canvas-bg); overflow: hidden; height: 100%; }
  /* The projector mirrors this screen, so the cursor would land on the model.
     It only comes back while calibrating, when crosshairs are dragged.
     TEMPORARILY disabled for dev/testing on a regular screen (no physical
     projector attached here) -- restore `cursor: none;` before the real rig
     is used, or the mouse will show up on the projected model. */
  /* body { cursor: none; } */
  body.calibrating, body.fitting-corners { cursor: crosshair; }
  canvas { display: block; }
  #status[hidden] { display: none; }
  #status {
    position: fixed; top: 8px; left: 8px; z-index: 10;
    font: 11px/1.4 ui-monospace, monospace; color: var(--status-text);
    background: var(--status-bg); padding: 4px 8px; border-radius: 3px;
    pointer-events: none;
  }
  #calibration-panel {
    position: fixed; top: 8px; right: 8px; z-index: 10; width: 260px;
    font: 11px/1.5 ui-monospace, monospace; color: var(--panel-text);
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 4px;
    padding: 8px; display: none;
  }
  #calibration-panel.active { display: block; }
  #calibration-panel h3 { margin: 0 0 6px; font-size: 12px; color: var(--panel-heading); }
  #calibration-panel .point-row { display: flex; gap: 4px; margin-bottom: 4px; align-items: center; }
  #calibration-panel .point-row span { width: 14px; color: var(--panel-muted); }
  #calibration-panel input { width: 70px; background: var(--input-bg); color: var(--input-text); border: 1px solid var(--input-border); font: inherit; padding: 2px; }
  #calibration-panel button { font: inherit; background: var(--button-bg); color: var(--button-text); border: 1px solid var(--button-border); border-radius: 3px; padding: 4px 8px; margin-top: 4px; margin-right: 4px; cursor: pointer; }
  #calibration-panel button:hover { background: var(--button-hover-bg); }
  #calibration-panel .hint { color: var(--panel-hint); margin-top: 6px; }
  #cal-message { margin-top: 6px; min-height: 14px; }
  #cal-message.error { color: var(--error-color); }
  #cal-message.ok { color: var(--ok-color); }
  /* Dev/testing aid, not part of the real projection -- a hovered vehicle's
     own data is never drawn onto the model, only shown here on whatever
     screen this page happens to be open on. pointer-events:none so the
     tooltip itself can never block the hover it's reporting on. */
  #hover-tooltip {
    position: fixed; z-index: 20; pointer-events: none;
    font: 11px/1.5 ui-monospace, monospace; color: var(--panel-text);
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 4px;
    padding: 6px 9px; white-space: nowrap;
  }
  #hover-tooltip[hidden] { display: none; }
  #hover-tooltip .route { color: var(--panel-heading); font-weight: 600; }
  #hover-tooltip .muted { color: var(--panel-muted); }
</style>
</head>
<body>
<div id="status" hidden>connecting...</div>
<div id="hover-tooltip" hidden></div>
<div id="calibration-panel">
  <h3>Calibration mode (C or the tablet to exit)</h3>
  <div id="calibration-points"></div>
  <button id="cal-add">+ point</button>
  <button id="cal-reset">reset</button>
  <button id="cal-save">save calibration</button>
  <div id="cal-message"></div>
  <div class="hint">Drag crosshairs to registration marks on the model, enter their known lat/lon, then save. Press V to toggle the verification overlay.</div>
</div>
<canvas id="canvas"></canvas>
<script>
"use strict";

// Colour encodes adherence state, tuned per theme so on_time still reads
// distinctly from late, which reads distinctly from very_late. The dark-mode
// palette is the brief's original -- bright on black, for projection onto a
// matte model. Those same hex values wash out on a light background, so
// light mode uses darker, more saturated variants for contrast instead.
const ADHERENCE_COLOR = {
  dark: {
    early: "#4da3ff", on_time: "#39ff6a", late: "#ffb020", very_late: "#c81c2e",
    cancelled: "#c81c2e", unknown: "#93a3b5",
  },
  light: {
    early: "#0969da", on_time: "#1a7f37", late: "#9a6700", very_late: "#cf222e",
    cancelled: "#cf222e", unknown: "#57606a",
  },
};

// Same wording as the controller's legends (renderer/controller.html's
// LEGENDS) and the engine's own labels (engine/normalise/levels.py), so the
// hover tooltip never says something different from what the legend says.
const ADHERENCE_LABEL = {
  early: "Early", on_time: "On time", late: "Late", very_late: "Missed its slot",
  cancelled: "Cancelled", unknown: "No schedule data",
};
const CONGESTION_LABEL = ["Running smoothly", "Stop and go", "Congested", "Severely congested"];
const CROWDING_LABEL = ["Seats available", "Few seats", "Standing room", "Crowded / full"];

// Congestion and crowding are ordinal levels from TfNSW's own feed fields
// (engine/normalise/levels.py): congestion 0 running smoothly .. 3 severe,
// crowding 0 seats available .. 3 crowded/full. Each palette runs cool to
// hot, distinct from the adherence greens so a glance tells you which lens
// is on. Index = level.
const LEVEL_COLOR = {
  congestion: {
    dark: ["#3ddc84", "#ffd23f", "#ff8c1a", "#ff2e4d"],
    light: ["#1a7f37", "#9a6700", "#bc4c00", "#cf222e"],
  },
  crowding: {
    dark: ["#5ec8ff", "#b48cff", "#ff7ad9", "#ff2e4d"],
    light: ["#0969da", "#8250df", "#bf3989", "#cf222e"],
  },
};

// Area layers (engine/demand/areas.py): each unit arrives with a 0-4 bin.
// Jobs are sequential (brighter = more); the service gap diverges
// from blue (more service than jobs) through grey to orange (underserved).
const AREA_COLOR = {
  jobs: ["#2a2f6b", "#43449e", "#6a56c9", "#9d6be3", "#d892ff"],
  service_gap: ["#2f7bff", "#86b4ff", "#62666e", "#ffb066", "#ff6a00"],
};
const AREA_ALPHA = { dark: 0.55, light: 0.45 };
// While an area layer is on, vehicles go neutral so they don't compete with it.
const NEUTRAL_DOT = { dark: "#f2f4f7", light: "#30363d" };

// Size/glow radius encodes mode, so heavy rail reads differently from a bus.
const MODE_RADIUS = {
  sydneytrains: 7, nswtrains: 7, metro: 7,
  lightrail_innerwest: 5.5, lightrail_cbdandsoutheast: 5.5,
  buses: 4, ferries: 4.5,
};
const DEFAULT_RADIUS = 4;

const TAIL_WINDOW_MS = 30000; // "last 30 seconds of travel"

// Canvas fill + corridor colours per theme -- kept in JS since
// these are drawn per-frame rather than styled with CSS. The theme itself
// comes from the server's control state (see applyControl), so the tablet
// controller and this page stay in sync.
const CANVAS_THEME = {
  dark: { bg: "#000", corridorDim: "rgba(220,228,238,0.55)", corridorBright: "rgba(255,255,255,0.95)", stop: "rgba(180,196,214,0.65)" },
  light: { bg: "#f4f6f8", corridorDim: "rgba(60,80,110,0.28)", corridorBright: "rgba(9,105,218,0.85)", stop: "rgba(60,90,130,0.55)" },
};
// Detailed background map (control.basemap = "detailed"), per theme: kept
// faint so routes, vehicles and the data layers stay on top visually.
const BASEMAP_THEME = {
  dark: { parks: "#123320", water: "#123a5e", coastline: "rgba(90,150,205,0.75)", roadsMinor: "rgba(255,255,255,0.17)", roadsMajor: "rgba(255,255,255,0.34)", rail: "rgba(255,190,120,0.40)",
    label: { suburb: "#e8edf3", neighbourhood: "#b9c3cf", station: "#ffd28a", landmark: "#d7c6f2", park: "#8fd19e", water: "#8ec5f0", road: "#aab4c0" } },
  light: { parks: "#cfe6c7", water: "#b9d6f0", coastline: "rgba(70,125,185,0.8)", roadsMinor: "rgba(0,0,0,0.14)", roadsMajor: "rgba(0,0,0,0.30)", rail: "rgba(130,70,20,0.40)",
    label: { suburb: "#1f2a37", neighbourhood: "#475463", station: "#8a4b00", landmark: "#5b3b8c", park: "#2f6b3a", water: "#24588c", road: "#4f5966" } },
};
// "Full" map labels, most important first: when two would overlap, the
// earlier kind keeps its place and the other is left out.
const LABEL_KINDS = [
  ["suburb", "600 13px", true],
  ["water", "italic 12px", false],
  ["station", "600 11px", false],
  ["landmark", "11px", false],
  ["park", "italic 11px", false],
  ["neighbourhood", "11px", false],
  ["road", "10px", false],
];
const LABEL_FONT = "-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif";
let theme = "dark";

// The server's display-control state (engine/publish/control.py). Every
// change -- from the tablet or from this page's keyboard shortcuts -- goes to
// the server first and comes back here via applyControl, so there is only
// ever one source of truth.
let control = {
  theme: "dark", basemap: "plain", verify: false, hud: false, calibrate: false, early_buses: true, blue_highlight: false, stops: false, stop_history: false, stop_metric: "median", routes: [], route_slots: {},
  lens: "adherence", area_layer: "none", area_unit: "zones", modes: {}, nudge: { dx: 0, dy: 0, scale: 1 },
  corners: false, warp: { tl: [0, 0], tr: [0, 0], br: [0, 0], bl: [0, 0] },
};
let modeToGroup = {}; // feed mode -> controller group, from /config

// Static area layers from /areas: {zones: [...], grid: [...]}, each unit
// {rings: [[[lat, lon], ...]], bins: {jobs, service_gap}}. Drawn once
// into an offscreen canvas per (layer, unit, theme, projection).
let areas = null;
let areaLayerCanvas = null;

// Detailed background map from /basemap (static, fetched the first time it is
// switched on), drawn once per theme/projection like the corridors.
let basemap = null;
let basemapCanvas = null;
let basemapLabelsCanvas = null;

// Stop markers from /stops (static for the life of a run, like shapes).
// stopScreenPositions is a parallel [{name, x, y}, ...] in the SAME
// projection as stopsLayerCanvas, kept alongside it so hover hit-testing
// doesn't need to re-run projector.project() on ~2,900 points every frame.
let stops = [];
let stopRoutes = new Map(); // stop id -> route names serving it, from /stops
let stopsLayerCanvas = null;
let stopScreenPositions = [];

// Stop history from /stop_history (engine/history/store.py stop_summaries),
// refreshed every minute while the layer is on. Same projection-cached
// pattern as the plain markers; positions carry each stop's summary for hover.
let stopHistory = null;
let stopHistoryCanvas = null;
let stopHistoryPositions = [];
let lastStopHistoryPoll = 0;

// Routes singled out from the controller (control.routes, by short name):
// their lines and stops are drawn in the route's own colour, the stop layers
// narrow to their stops, and every other vehicle fades back.
let routeDetails = {}; // name -> /route body (shape_ids, stop_ids, color)
let routeFocusCanvas = null;
let routeStopPositions = [];
const UNFOCUSED_OPACITY = 0.12;

function focusActive() { return Array.isArray(control.routes) && control.routes.length > 0; }

function focusedStopIds() {
  const ids = new Set();
  for (const name of control.routes || []) {
    for (const id of (routeDetails[name] && routeDetails[name].stop_ids) || []) ids.add(id);
  }
  return ids;
}

// Hover highlight: pointing at a vehicle lights up its route; pointing at a
// stop lights up every route serving it (from /stops' "routes"). Local to this
// page -- it follows the pointer, not the shared display state -- and drawn
// over the street colours, under the vehicles. The tablet's "Highlight colour"
// switch (control.blue_highlight) swaps the usual colour for a bright blue.
const HOVER_ROUTE_COLOR = { dark: "#ffffff", light: "#0b3d91" };
const HOVER_ROUTE_BLUE = { dark: "#3d7bff", light: "#0a5cff" };
function hoverRouteColor() { return (control.blue_highlight ? HOVER_ROUTE_BLUE : HOVER_ROUTE_COLOR)[theme]; }
let hoverRoutesKey = "";
let hoverRouteNames = [];
let hoverRouteCanvas = null;

async function fetchRouteDetails(names) {
  const missing = names.filter((n) => !(n in routeDetails));
  await Promise.all(missing.map(async (name) => {
    try {
      const resp = await fetch(`/route?name=${encodeURIComponent(name)}`);
      routeDetails[name] = resp.ok ? await resp.json() : null;
    } catch (_) { /* leave it missing so the next hover retries */ }
  }));
}

async function setHoverRoutes(names) {
  const key = names.join(",");
  if (key === hoverRoutesKey) return;
  hoverRoutesKey = key;
  hoverRouteNames = names;
  if (!names.length) { hoverRouteCanvas = null; return; }
  await fetchRouteDetails(names);
  if (hoverRoutesKey === key) hoverRouteCanvas = drawHoverRoutes(names); // unless the pointer has moved on
}

function drawHoverRoutes(names) {
  if (!projector || !shapes) return null;
  const off = document.createElement("canvas");
  off.width = canvas.width;
  off.height = canvas.height;
  const octx = off.getContext("2d");
  octx.lineCap = "round";
  octx.lineJoin = "round";
  for (const pass of [{ width: 9, alpha: 0.25 }, { width: 3, alpha: 0.95 }]) {
    octx.lineWidth = pass.width;
    octx.strokeStyle = withAlpha(hoverRouteColor(), pass.alpha);
    for (const name of names) {
      for (const shapeId of (routeDetails[name] && routeDetails[name].shape_ids) || []) {
        const pts = shapes[shapeId];
        if (!pts || pts.length < 2) continue;
        octx.beginPath();
        pts.forEach(([lat, lon], i) => {
          const [x, y] = projector.project(lat, lon);
          if (i === 0) octx.moveTo(x, y); else octx.lineTo(x, y);
        });
        octx.stroke();
      }
    }
  }
  return off;
}

async function loadRouteFocus() {
  const missing = (control.routes || []).filter((n) => !(n in routeDetails));
  await Promise.all(missing.map(async (name) => {
    try {
      const resp = await fetch(`/route?name=${encodeURIComponent(name)}`);
      routeDetails[name] = resp.ok ? await resp.json() : null;
    } catch (_) { /* leave it missing so the next change retries */ }
  }));
  routeFocusCanvas = drawRouteFocusLayer();
  stopsLayerCanvas = drawStopsLayer();
  stopHistoryCanvas = drawStopHistoryLayer();
}

// Eight distinct hues in a fixed order (colour-blind-safe for neighbouring
// slots), one per singled-out route by the slot the server assigned it --
// the same palette as controller.html's ROUTE_PALETTE, so tablet tags match.
const ROUTE_PALETTE = {
  dark: ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"],
  light: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"],
};

function routeColor(name) {
  const slot = control.route_slots ? control.route_slots[name] : undefined;
  return ROUTE_PALETTE[theme][slot ?? 0];
}

function drawRouteFocusLayer() {
  routeStopPositions = [];
  if (!focusActive() || !projector || !shapes) return null;
  const off = document.createElement("canvas");
  off.width = canvas.width;
  off.height = canvas.height;
  const octx = off.getContext("2d");
  octx.lineCap = "round";
  octx.lineJoin = "round";
  const servedBy = new Map(); // stop_id -> [route names]
  for (const pass of [{ width: 10, alpha: 0.22 }, { width: 3.5, alpha: 0.95 }]) {
    octx.lineWidth = pass.width;
    for (const name of control.routes) {
      const detail = routeDetails[name];
      if (!detail) continue;
      octx.strokeStyle = withAlpha(routeColor(name), pass.alpha);
      for (const shapeId of detail.shape_ids) {
        const pts = shapes[shapeId];
        if (!pts || pts.length < 2) continue;
        octx.beginPath();
        pts.forEach(([lat, lon], i) => {
          const [x, y] = projector.project(lat, lon);
          if (i === 0) octx.moveTo(x, y); else octx.lineTo(x, y);
        });
        octx.stroke();
      }
    }
  }
  // Stop rings follow the stop layers: with both off the route is just its line.
  if (!control.stops && !control.stop_history) return off;
  for (const name of control.routes) {
    for (const id of (routeDetails[name] && routeDetails[name].stop_ids) || []) {
      if (!servedBy.has(id)) servedBy.set(id, []);
      servedBy.get(id).push(name);
    }
  }
  octx.fillStyle = CANVAS_THEME[theme].bg;
  octx.lineWidth = 2;
  for (const s of stops) {
    const names = servedBy.get(s.id);
    if (!names) continue;
    const [x, y] = projector.project(s.lat, s.lon);
    octx.strokeStyle = routeColor(names[0]);
    octx.beginPath();
    octx.arc(x, y, STOP_HISTORY_RADIUS + 1.5, 0, Math.PI * 2);
    octx.fill();
    octx.stroke();
    routeStopPositions.push({ id: s.id, name: s.name, x, y, routes: names });
  }
  return off;
}

// Live or replay, from each vehicle frame. During a time-lapse, positions
// arrive `speed` times faster, so interpolation and fade-out timing shrink to
// match; a new epoch (source switched, or a replay looped) clears the screen.
let playback = { mode: "live", speed: 1 };
let pausedAtMs = null;

function setPlayback(next) {
  const paused = next.mode === "replay" && !!next.paused;
  if (paused && pausedAtMs === null) {
    pausedAtMs = performance.now();
  } else if (!paused && pausedAtMs !== null) {
    // shift every vehicle's clock by the pause, so nothing jumps or fades on resume
    const pausedFor = performance.now() - pausedAtMs;
    for (const entry of vehicles.values()) entry.currReceivedAt += pausedFor;
    pausedAtMs = null;
  }
  playback = next;
}
let epoch = null;
function pollIntervalMs() { return ((cfg.poll_interval_seconds || 15) * 1000) / (playback.speed || 1); }
function staleAfterMs() { return ((cfg.stale_after_seconds || 90) * 1000) / (playback.speed || 1); }

function applyControl(next) {
  const areaChanged = next.area_layer !== control.area_layer || next.area_unit !== control.area_unit;
  const stopHistoryChanged =
    next.stop_history !== control.stop_history || next.lens !== control.lens || next.stop_metric !== control.stop_metric;
  const routesChanged = JSON.stringify(next.routes || []) !== JSON.stringify(control.routes || []);
  const stopLayersChanged = next.stops !== control.stops || next.stop_history !== control.stop_history;
  const basemapChanged = next.basemap !== control.basemap;
  const highlightChanged = next.blue_highlight !== control.blue_highlight;
  const layoutChanged =
    next.theme !== control.theme ||
    next.calibrate !== control.calibrate ||
    JSON.stringify(next.nudge) !== JSON.stringify(control.nudge) ||
    JSON.stringify(next.warp) !== JSON.stringify(control.warp);
  control = next;
  theme = control.theme === "light" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", theme);
  verificationMode = control.verify;
  statusEl.hidden = !control.hud;
  if (control.calibrate && !calibrateMode) enterCalibrateMode();
  if (!control.calibrate && calibrateMode) exitCalibrateMode();
  fittingCorners = control.corners && !calibrateMode;
  document.body.classList.toggle("fitting-corners", fittingCorners);
  if (draggingCorner === null) dragWarp = null; // the server's copy has caught up
  if (layoutChanged) rebuildLayers();
  else if (highlightChanged) hoverRouteCanvas = hoverRouteNames.length ? drawHoverRoutes(hoverRouteNames) : null;
  else if (areaChanged) areaLayerCanvas = drawAreaLayer();
  if (routesChanged) loadRouteFocus();
  else if (!layoutChanged && focusActive() && stopLayersChanged) {
    routeFocusCanvas = drawRouteFocusLayer();
  }
  if (stopHistoryChanged && control.stop_history) {
    if (!stopHistory) pollStopHistory();
    else if (!layoutChanged) stopHistoryCanvas = drawStopHistoryLayer();
  }
  if (basemapChanged && control.basemap !== "plain" && !basemap) loadBasemap();
}

function levelColor(layer, level) {
  if (level === null || level === undefined) return null;
  const palette = LEVEL_COLOR[layer][theme];
  return palette[Math.max(0, Math.min(palette.length - 1, Math.round(level)))];
}

function dotColor(entry) {
  if (control.area_layer !== "none") return NEUTRAL_DOT[theme];
  const unknown = ADHERENCE_COLOR[theme].unknown;
  if (control.lens === "congestion") return levelColor("congestion", entry.cg) || unknown;
  if (control.lens === "crowding") return levelColor("crowding", entry.oc) || unknown;
  // Early buses switch off: a bus running early shows as on time (the Stats
  // tab and exports keep the real state either way)
  const state = entry.adherence === "early" && !control.early_buses ? "on_time" : entry.adherence;
  return ADHERENCE_COLOR[theme][state] || unknown;
}

function sendControl(patch) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ control: patch }));
}

function modeVisible(mode) {
  const group = modeToGroup[mode];
  return !group || control.modes[group] !== false;
}

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");

let cfg = null;
let shapes = null;
let calibration = null; // saved homography record from GET /calibration, or null
let corridorLayerDim = null;    // offscreen canvas, normal dim base layer
let corridorLayerBright = null; // offscreen canvas, verification-overlay brightness
let projector = null;

// vehicleKey -> { prev: {lat,lon,ts}, curr: {lat,lon,ts}, currReceivedAt: number,
//                 route_color, adherence, mode, history: [{lat,lon,ts}] }
const vehicles = new Map();

// Dev/testing hover tooltip state -- see the #hover-tooltip CSS comment.
// Screen-space mouse position (canvas-relative), or null when the pointer
// isn't over the canvas at all.
let hoverX = null;
let hoverY = null;
const hoverTooltipEl = document.getElementById("hover-tooltip");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  rebuildLayers();
}
window.addEventListener("resize", resize);

function rebuildLayers() {
  if (!cfg || !shapes) return;
  projector = selectProjector();
  corridorLayerDim = drawCorridorLayer(CANVAS_THEME[theme].corridorDim, 1);
  corridorLayerBright = drawCorridorLayer(CANVAS_THEME[theme].corridorBright, 1.6);
  areaLayerCanvas = drawAreaLayer();
  stopsLayerCanvas = drawStopsLayer();
  stopHistoryCanvas = drawStopHistoryLayer();
  routeFocusCanvas = drawRouteFocusLayer();
  basemapCanvas = drawBasemapLayer();
  basemapLabelsCanvas = drawBasemapLabels();
  hoverRouteCanvas = hoverRouteNames.length ? drawHoverRoutes(hoverRouteNames) : null;
}

// Screen positions of the footprint's corners, in WARP_CORNERS order.
function footprintCorners(proj) {
  const bb = cfg.bounding_box;
  return [[bb.north, bb.west], [bb.north, bb.east], [bb.south, bb.east], [bb.south, bb.west]]
    .map(([lat, lon]) => proj.project(lat, lon));
}

function clipToFootprint() {
  ctx.beginPath();
  footprintCorners(projector).forEach(([x, y], i) => {
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.clip();
}

function drawAreaLayer() {
  const layer = control.area_layer;
  if (layer === "none" || !areas || !projector) return null;
  const units = areas[control.area_unit] || [];
  const off = document.createElement("canvas");
  off.width = canvas.width;
  off.height = canvas.height;
  const octx = off.getContext("2d");
  octx.globalAlpha = AREA_ALPHA[theme];
  octx.lineJoin = "round";
  for (const unit of units) {
    const bin = unit.bins[layer];
    if (bin === null || bin === undefined) continue;
    octx.fillStyle = AREA_COLOR[layer][bin];
    octx.beginPath();
    for (const ring of unit.rings) {
      ring.forEach(([lat, lon], i) => {
        const [x, y] = projector.project(lat, lon);
        if (i === 0) octx.moveTo(x, y); else octx.lineTo(x, y);
      });
      octx.closePath();
    }
    octx.fill();
  }
  // Thin unit outlines so neighbouring zones in the same bin stay readable.
  octx.globalAlpha = 0.25;
  octx.strokeStyle = CANVAS_THEME[theme].bg;
  octx.lineWidth = 1;
  for (const unit of units) {
    if (unit.bins[layer] === null || unit.bins[layer] === undefined) continue;
    octx.beginPath();
    for (const ring of unit.rings) {
      ring.forEach(([lat, lon], i) => {
        const [x, y] = projector.project(lat, lon);
        if (i === 0) octx.moveTo(x, y); else octx.lineTo(x, y);
      });
      octx.closePath();
    }
    octx.stroke();
  }
  return off;
}

// Built in the background at server start, so retry until it's ready.
async function loadAreas() {
  try {
    const resp = await fetch("/areas", { cache: "no-store" });
    const body = resp.ok ? await resp.json() : null;
    if (body && (body.zones.length || body.grid.length)) {
      areas = body;
      areaLayerCanvas = drawAreaLayer();
      return;
    }
  } catch (_) { /* retry below */ }
  setTimeout(loadAreas, 5000);
}

// A saved calibration (Phase 5) takes over from the flat-screen linear fit
// (Phase 4) the moment one exists -- the renderer's drawing code doesn't
// change either way, only which object satisfies project(lat, lon), per
// the brief's "structure the coordinate transform so a more sophisticated
// mapping could replace [it] later without touching the renderer's drawing
// code."
function selectProjector() {
  const base = calibration ? makeHomographyProjector(calibration) : makeProjector(cfg.bounding_box, canvas.width, canvas.height);
  // Crosshairs are placed in raw screen pixels, so the nudge and corner warp
  // are switched off while calibrating (and reset by the server once a
  // calibration is saved).
  if (calibrateMode) return base;
  unwarpedProjector = withNudge(base, control.nudge);
  return withWarp(unwarpedProjector, dragWarp || control.warp);
}

// A small shift/scale about the screen centre on top of whichever projector
// is active -- for drift between weekly sessions, without redoing the
// crosshairs.
function withNudge(base, nudge) {
  if (!nudge || (nudge.dx === 0 && nudge.dy === 0 && nudge.scale === 1)) return base;
  const cx = canvas.width / 2, cy = canvas.height / 2;
  return {
    project(lat, lon) {
      const [x, y] = base.project(lat, lon);
      return [cx + (x - cx) * nudge.scale + nudge.dx, cy + (y - cy) * nudge.scale + nudge.dy];
    },
  };
}

// Corner pin on top of the nudge: each footprint corner is moved by its
// offset in control.warp and everything in between follows the homography
// through those four points. This is what takes out projector keystone
// (a trapezoid instead of a rectangle), which shift/scale can't.
const WARP_CORNERS = ["tl", "tr", "br", "bl"];

function warpIsIdentity(warp) {
  return !warp || WARP_CORNERS.every((c) => !warp[c] || (warp[c][0] === 0 && warp[c][1] === 0));
}

function warpedCorners(src, warp) {
  return src.map(([x, y], i) => [x + warp[WARP_CORNERS[i]][0], y + warp[WARP_CORNERS[i]][1]]);
}

function withWarp(base, warp) {
  if (warpIsIdentity(warp)) return base;
  const src = footprintCorners(base);
  const h = quadHomography(src, warpedCorners(src, warp));
  if (!h) return base;
  return {
    project(lat, lon) {
      const [x, y] = base.project(lat, lon);
      return applyHomography(h, x, y);
    },
  };
}

// Homography taking four screen points onto four others: 8 unknowns (h33 =
// 1), two equations per point, solved by Gaussian elimination. Null when the
// points are degenerate (three in a line).
function quadHomography(src, dst) {
  const a = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [u, v] = dst[i];
    a.push([x, y, 1, 0, 0, 0, -u * x, -u * y, u]);
    a.push([0, 0, 0, x, y, 1, -v * x, -v * y, v]);
  }
  for (let col = 0; col < 8; col++) {
    let pivot = col;
    for (let r = col + 1; r < 8; r++) if (Math.abs(a[r][col]) > Math.abs(a[pivot][col])) pivot = r;
    if (Math.abs(a[pivot][col]) < 1e-9) return null;
    [a[col], a[pivot]] = [a[pivot], a[col]];
    for (let r = 0; r < 8; r++) {
      if (r === col) continue;
      const f = a[r][col] / a[col][col];
      for (let c = col; c < 9; c++) a[r][c] -= f * a[col][c];
    }
  }
  const h = a.map((row, i) => row[8] / row[i]);
  return [[h[0], h[1], h[2]], [h[3], h[4], h[5]], [h[6], h[7], 1]];
}

// A corner dragged past its neighbours would fold the map over itself.
function isConvexQuad(pts) {
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % 4], [cx, cy] = pts[(i + 2) % 4];
    const cross = (bx - ax) * (cy - by) - (by - ay) * (cx - bx);
    if (Math.abs(cross) < 1e-6) return false;
    if (sign === 0) sign = Math.sign(cross);
    else if (Math.sign(cross) !== sign) return false;
  }
  return true;
}

// Aspect-correct fit of the bounding box into the canvas: a naive
// lon/lat -> x/y stretch would visibly distort corridor shapes since the box
// isn't square (~5km N-S x 4km E-W). Longitude degrees are scaled by
// cos(latitude) so a metre is a metre in both directions.
function makeProjector(bbox, width, height) {
  const midLatRad = ((bbox.north + bbox.south) / 2) * Math.PI / 180;
  const lonScale = Math.cos(midLatRad);
  const spanX = (bbox.east - bbox.west) * lonScale;
  const spanY = (bbox.north - bbox.south);
  const scale = Math.min(width / spanX, height / spanY) * 0.94; // small margin
  const offsetX = (width - spanX * scale) / 2;
  const offsetY = (height - spanY * scale) / 2;
  return {
    project(lat, lon) {
      const x = (lon - bbox.west) * lonScale * scale + offsetX;
      const y = (bbox.north - lat) * scale + offsetY; // lat increases north; screen y increases down
      return [x, y];
    },
  };
}

// Same simple equirectangular-at-box-centre projection calibration.py uses
// to build the homography, reproduced here since the browser has no pyproj.
// Must match calibration.py's to_local_metric exactly.
const DEG_TO_M = 111320.0;
function toLocalMetric(lat, lon, centerLat, centerLon) {
  const x = (lon - centerLon) * Math.cos(centerLat * Math.PI / 180) * DEG_TO_M;
  const y = (lat - centerLat) * DEG_TO_M;
  return [x, y];
}

function applyHomography(h, x, y) {
  const wx = h[0][0] * x + h[0][1] * y + h[0][2];
  const wy = h[1][0] * x + h[1][1] * y + h[1][2];
  const w  = h[2][0] * x + h[2][1] * y + h[2][2];
  return [wx / w, wy / w];
}

function makeHomographyProjector(calib) {
  return {
    project(lat, lon) {
      const [x, y] = toLocalMetric(lat, lon, calib.center_lat, calib.center_lon);
      return applyHomography(calib.homography, x, y);
    },
  };
}

function drawCorridorLayer(strokeStyle, lineWidth) {
  const off = document.createElement("canvas");
  off.width = canvas.width;
  off.height = canvas.height;
  const octx = off.getContext("2d");
  octx.strokeStyle = strokeStyle;
  octx.lineWidth = lineWidth;
  octx.lineJoin = "round";
  for (const shapeId in shapes) {
    const pts = shapes[shapeId];
    octx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const [x, y] = projector.project(pts[i][0], pts[i][1]);
      if (i === 0) octx.moveTo(x, y); else octx.lineTo(x, y);
    }
    octx.stroke();
  }
  return off;
}

async function loadBasemap() {
  try {
    const resp = await fetch("/basemap");
    if (!resp.ok) return; // not downloaded: the plain background stays
    basemap = await resp.json();
    basemapCanvas = drawBasemapLayer();
    basemapLabelsCanvas = drawBasemapLabels();
  } catch (_) { /* switching it off and on again retries */ }
}

function drawBasemapLayer() {
  if (!basemap || !projector) return null;
  const off = document.createElement("canvas");
  off.width = canvas.width;
  off.height = canvas.height;
  const octx = off.getContext("2d");
  const colors = BASEMAP_THEME[theme];
  const L = basemap.layers;
  const trace = (pts) => {
    for (let i = 0; i < pts.length; i++) {
      const [x, y] = projector.project(pts[i][0], pts[i][1]);
      if (i === 0) octx.moveTo(x, y); else octx.lineTo(x, y);
    }
  };
  // One fill per ring: in a single path, overlapping rings wound in opposite
  // directions cancel out (the harbour vanished that way).
  const fill = (rings, color) => {
    octx.fillStyle = color;
    for (const ring of rings) {
      octx.beginPath();
      trace(ring);
      octx.closePath();
      octx.fill();
    }
  };
  const stroke = (lines, color, width) => {
    octx.strokeStyle = color;
    octx.lineWidth = width;
    octx.beginPath();
    for (const line of lines) trace(line);
    octx.stroke();
  };
  octx.lineJoin = "round";
  octx.lineCap = "round";
  fill(L.parks, colors.parks);
  fill(L.water, colors.water);
  stroke(L.coastline, colors.coastline, 1.4);
  stroke(L.roads_minor, colors.roadsMinor, 0.7);
  stroke(L.roads_major, colors.roadsMajor, 1.5);
  stroke(L.rail, colors.rail, 1.1);
  return off;
}

// Text stays upright on screen whatever the calibration does; road names
// follow the road's direction. Placed greedily in LABEL_KINDS order, skipping
// any whose box would overlap one already placed.
function drawBasemapLabels() {
  if (!basemap || !projector || !basemap.layers.labels) return null;
  const off = document.createElement("canvas");
  off.width = canvas.width;
  off.height = canvas.height;
  const octx = off.getContext("2d");
  const colors = BASEMAP_THEME[theme].label;
  const placed = [];
  const PAD = 3;
  const overlaps = (b) => placed.some((q) => b[0] < q[2] && b[2] > q[0] && b[1] < q[3] && b[3] > q[1]);
  // Only labels that fit wholly on the model: half a name cut off at the
  // edge reads worse than none. The footprint is a convex quad on screen.
  const bb = cfg.bounding_box;
  const quad = [[bb.north, bb.west], [bb.north, bb.east], [bb.south, bb.east], [bb.south, bb.west]]
    .map(([lat, lon]) => projector.project(lat, lon));
  const side = (p, a, b) => Math.sign((b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]));
  const inside = (p) => {
    const s = quad.map((a, i) => side(p, a, quad[(i + 1) % 4]));
    return s.every((v) => v >= 0) || s.every((v) => v <= 0);
  };
  const onModel = (b) => [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]].every(inside);
  octx.textAlign = "center";
  octx.textBaseline = "middle";
  octx.lineJoin = "round";
  octx.strokeStyle = CANVAS_THEME[theme].bg;
  octx.lineWidth = 3;
  for (const [kind, font, upper] of LABEL_KINDS) {
    octx.font = `${font} ${LABEL_FONT}`;
    octx.fillStyle = colors[kind];
    const size = parseInt(font.match(/(\d+)px/)[1], 10);
    for (const lab of basemap.layers.labels) {
      if (lab.k !== kind) continue;
      const text = upper ? lab.t.toUpperCase() : lab.t;
      const [x, y] = projector.project(lab.lat, lab.lon);
      if (x < 0 || y < 0 || x > off.width || y > off.height) continue;
      let angle = 0;
      if (lab.lat2 !== undefined) {
        const [x2, y2] = projector.project(lab.lat2, lab.lon2);
        angle = Math.atan2(y2 - y, x2 - x);
        if (angle > Math.PI / 2) angle -= Math.PI; else if (angle < -Math.PI / 2) angle += Math.PI;
      }
      const w = octx.measureText(text).width + (upper ? text.length * 1.2 : 0);
      const h = size + 2;
      // axis-aligned box around the (possibly rotated) text
      const cos = Math.abs(Math.cos(angle)), sin = Math.abs(Math.sin(angle));
      const bw = w * cos + h * sin, bh = w * sin + h * cos;
      const box = [x - bw / 2 - PAD, y - bh / 2 - PAD, x + bw / 2 + PAD, y + bh / 2 + PAD];
      if (!onModel(box) || overlaps(box)) continue;
      placed.push(box);
      octx.save();
      octx.translate(x, y);
      octx.rotate(angle);
      if (upper) octx.letterSpacing = "1.2px";
      octx.strokeText(text, 0, 0);
      octx.fillText(text, 0, 0);
      octx.restore();
    }
  }
  return off;
}

const STOP_MARKER_RADIUS = 2.5;

function drawStopsLayer() {
  const off = document.createElement("canvas");
  off.width = canvas.width;
  off.height = canvas.height;
  const octx = off.getContext("2d");
  octx.fillStyle = CANVAS_THEME[theme].stop;
  const only = focusActive() ? focusedStopIds() : null;
  stopScreenPositions = [];
  for (const s of stops) {
    if (only && !only.has(s.id)) continue;
    const [x, y] = projector.project(s.lat, s.lon);
    octx.beginPath();
    octx.arc(x, y, STOP_MARKER_RADIUS, 0, Math.PI * 2);
    octx.fill();
    stopScreenPositions.push({ id: s.id, name: s.name, x, y });
  }
  return off;
}

// Fixed bands, chosen from the first ~56k recorded visits so stops actually
// spread across them -- the vehicle cut-offs (late = 5+ min) would paint
// nearly every stop the same, since a stop's *typical* delay is far smaller
// than one late bus. Delay: under 1, 1-2, 2-4, over 4 min. Crowding: share
// of arrivals with few seats or fuller -- under 10%, 10-25%, 25-50%, over 50%.
const STOP_HISTORY_MIN_VISITS = 20;
const STOP_DELAY_BANDS_S = [60, 120, 240];
const STOP_CROWDED_BANDS = [0.1, 0.25, 0.5];
const STOP_DELAY_COLOR = {
  dark: ["#39ff6a", "#ffd23f", "#ff8c1a", "#c81c2e"],
  light: ["#1a7f37", "#9a6700", "#bc4c00", "#cf222e"],
};
const STOP_HISTORY_RADIUS = 4;

function bandIndex(value, bands) {
  let i = 0;
  while (i < bands.length && value >= bands[i]) i++;
  return i;
}

// Crowding lens shows crowding; schedule and traffic both show delay, since
// stops have no traffic reading of their own.
function stopHistoryColor(h) {
  if (control.lens === "crowding") {
    if (h.crowding_visits < STOP_HISTORY_MIN_VISITS) return null;
    return LEVEL_COLOR.crowding[theme][bandIndex(h.crowded_share, STOP_CROWDED_BANDS)];
  }
  if (h.delay_visits < STOP_HISTORY_MIN_VISITS) return null;
  const delay = control.stop_metric === "mean" ? h.mean_delay_s : h.median_delay_s;
  return STOP_DELAY_COLOR[theme][bandIndex(delay, STOP_DELAY_BANDS_S)];
}

async function pollStopHistory() {
  if (!control.stop_history) return;
  lastStopHistoryPoll = performance.now();
  try {
    const resp = await fetch("/stop_history", { cache: "no-store" });
    if (!resp.ok) return;
    stopHistory = await resp.json();
    stopHistoryCanvas = drawStopHistoryLayer();
  } catch (_) { /* keep the last drawing; the next poll retries */ }
}
setInterval(() => {
  if (performance.now() - lastStopHistoryPoll >= 60000) pollStopHistory();
}, 5000);

function drawStopHistoryLayer() {
  if (!stopHistory || !projector) return null;
  const off = document.createElement("canvas");
  off.width = canvas.width;
  off.height = canvas.height;
  const octx = off.getContext("2d");
  const graded = [];
  const thin = [];
  const only = focusActive() ? focusedStopIds() : null;
  stopHistoryPositions = [];
  for (const s of stops) {
    const h = stopHistory[s.id];
    if (!h || (only && !only.has(s.id))) continue;
    const [x, y] = projector.project(s.lat, s.lon);
    const color = stopHistoryColor(h);
    const pos = { id: s.id, name: s.name, x, y, history: h, color };
    (color ? graded : thin).push(pos);
    stopHistoryPositions.push(pos);
  }
  octx.fillStyle = withAlpha(ADHERENCE_COLOR[theme].unknown, 0.5);
  for (const p of thin) {
    octx.beginPath();
    octx.arc(p.x, p.y, STOP_MARKER_RADIUS, 0, Math.PI * 2);
    octx.fill();
  }
  octx.strokeStyle = CANVAS_THEME[theme].bg;
  octx.lineWidth = 1;
  for (const p of graded) {
    octx.fillStyle = p.color;
    octx.beginPath();
    octx.arc(p.x, p.y, STOP_HISTORY_RADIUS, 0, Math.PI * 2);
    octx.fill();
    octx.stroke();
  }
  return off;
}

function applyFrame(frameVehicles) {
  const seen = new Set();
  for (const v of frameVehicles) {
    seen.add(v.k);
    let entry = vehicles.get(v.k);
    if (!entry) {
      entry = { prev: null, curr: null, currReceivedAt: 0, history: [] };
      vehicles.set(v.k, entry);
    }
    entry.mode = v.m;
    entry.route_color = v.rc;
    entry.route_short_name = v.rsn;
    entry.adherence = v.adh;
    entry.deviation = v.dev;
    entry.cg = v.cg;
    entry.oc = v.oc;
    entry.bearing = v.b;

    const sample = { lat: v.lat, lon: v.lon, ts: v.ts };
    if (!entry.curr || entry.curr.ts !== sample.ts) {
      if (entry.curr) {
        const moved = movementBearing(entry.curr, sample);
        if (moved !== null) entry.moveBearing = moved;
      }
      entry.prev = entry.curr;
      entry.curr = sample;
      entry.currReceivedAt = performance.now();
      entry.history.push(sample);
      const cutoff = (v.ts || 0) - TAIL_WINDOW_MS / 1000;
      entry.history = entry.history.filter((s) => (s.ts || 0) >= cutoff);
    }
  }
}

function lerp(a, b, t) { return a + (b - a) * t; }

// GTFS-RT bearing is degrees clockwise from true north. Projecting a point a
// few metres along it (rather than assuming north = screen-up) keeps arrows
// correct under the calibration's rotation/skew.
function screenHeading(lat, lon, bearingDeg, x, y) {
  const rad = (bearingDeg * Math.PI) / 180;
  const step = 1e-4;
  const [x2, y2] = projector.project(
    lat + Math.cos(rad) * step,
    lon + (Math.sin(rad) * step) / Math.cos((lat * Math.PI) / 180),
  );
  return Math.atan2(y2 - y, x2 - x);
}

// Degrees clockwise from north between two positions, or null if it moved
// too little to trust (GPS jitter at a platform would spin the arrow).
const MIN_HEADING_MOVE_M = 15;
function movementBearing(from, to) {
  const dNorth = (to.lat - from.lat) * 111320;
  const dEast = (to.lon - from.lon) * 111320 * Math.cos((from.lat * Math.PI) / 180);
  if (Math.hypot(dNorth, dEast) < MIN_HEADING_MOVE_M) return null;
  return (Math.atan2(dEast, dNorth) * 180) / Math.PI;
}

// Notched arrowhead centred on (x, y), sized off the mode's dot radius.
function traceArrow(x, y, angle, r) {
  const c = Math.cos(angle), s = Math.sin(angle);
  const pt = (fx, fy) => [x + fx * c - fy * s, y + fx * s + fy * c];
  const pts = [pt(1.8 * r, 0), pt(-1.2 * r, 1.2 * r), pt(-0.5 * r, 0), pt(-1.2 * r, -1.2 * r)];
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}

function currentRenderPosition(entry, nowMs) {
  const pollMs = pollIntervalMs();
  if (!entry.curr) return null;
  if (!entry.prev) return [entry.curr.lat, entry.curr.lon, 0];
  const elapsed = nowMs - entry.currReceivedAt;
  const t = Math.max(0, Math.min(1, elapsed / pollMs)); // never extrapolate past one poll interval
  const lat = lerp(entry.prev.lat, entry.curr.lat, t);
  const lon = lerp(entry.prev.lon, entry.curr.lon, t);
  return [lat, lon, elapsed];
}

function render() {
  requestAnimationFrame(render);
  if (cornerDragDirty) { cornerDragDirty = false; rebuildLayers(); }
  if (!projector || !corridorLayerDim) return;

  ctx.fillStyle = CANVAS_THEME[theme].bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Nothing is drawn outside the model's footprint, where it would land on the
  // table rather than the model. Calibration sees the whole screen.
  ctx.save();
  if (!calibrateMode) clipToFootprint();
  if (control.basemap !== "plain" && basemapCanvas && !verificationMode) ctx.drawImage(basemapCanvas, 0, 0);
  if (areaLayerCanvas && !verificationMode) ctx.drawImage(areaLayerCanvas, 0, 0);
  ctx.drawImage(verificationMode ? corridorLayerBright : corridorLayerDim, 0, 0);
  if (focusActive() && routeFocusCanvas) ctx.drawImage(routeFocusCanvas, 0, 0);
  if (control.stops && stopsLayerCanvas) ctx.drawImage(stopsLayerCanvas, 0, 0);
  if (control.stop_history && stopHistoryCanvas) ctx.drawImage(stopHistoryCanvas, 0, 0);

  if (hoverRouteCanvas) ctx.drawImage(hoverRouteCanvas, 0, 0);
  // Names sit above the street colours but under the vehicles.
  if (control.basemap === "full" && basemapLabelsCanvas && !verificationMode) ctx.drawImage(basemapLabelsCanvas, 0, 0);

  if (calibrateMode) drawCalibrationCrosshairs();

  // Paused replay: the picture holds still (positions and fade-outs use the
  // moment it paused).
  const nowMs = pausedAtMs ?? performance.now();
  const staleMs = staleAfterMs();
  const pollMs = pollIntervalMs();
  const toDelete = [];

  // Dev-only hover hit-test: whichever drawn dot is nearest the pointer,
  // within a few px of its own radius so small (bus) and large (train) dots
  // don't need the same fixed tolerance. Computed inline in the same loop
  // that draws the dots, so it's always testing exactly what's on screen
  // this frame, not a stale copy of it.
  let hoveredKey = null;
  let hoveredDist = Infinity;
  const hoverActive = !calibrateMode && !fittingCorners && hoverX !== null && hoverY !== null;

  const focusSet = focusActive() ? new Set(control.routes) : null;

  for (const [key, entry] of vehicles) {
    if (!modeVisible(entry.mode)) continue;
    const pos = currentRenderPosition(entry, nowMs);
    if (!pos) continue;
    const [lat, lon, elapsedSinceCurr] = pos;

    // Fade out once stale rather than freezing in place.
    let opacity = 1;
    if (elapsedSinceCurr > pollMs) {
      opacity = 1 - Math.min(1, (elapsedSinceCurr - pollMs) / (staleMs - pollMs));
    }
    if (opacity <= 0.02) { toDelete.push(key); continue; }
    const focused = !focusSet || focusSet.has(entry.route_short_name);
    if (!focused) opacity *= UNFOCUSED_OPACITY;

    const color = dotColor(entry);
    const radius = MODE_RADIUS[entry.mode] || DEFAULT_RADIUS;

    // Comet tail: the last ~30s of actual history plus the live interpolated point.
    const tailPts = entry.history.map((s) => projector.project(s.lat, s.lon));
    tailPts.push(projector.project(lat, lon));
    if (focused && tailPts.length > 1) {
      for (let i = 1; i < tailPts.length; i++) {
        const tailT = i / (tailPts.length - 1);
        ctx.strokeStyle = withAlpha(color, tailT * 0.5 * opacity);
        ctx.lineWidth = Math.max(1, radius * 0.4);
        ctx.beginPath();
        ctx.moveTo(tailPts[i - 1][0], tailPts[i - 1][1]);
        ctx.lineTo(tailPts[i][0], tailPts[i][1]);
        ctx.stroke();
      }
    }

    const [x, y] = projector.project(lat, lon);

    // Solid arrow -- no glow gradient. Heading is the feed's own bearing, or
    // for Sydney Trains (which never send one) the direction of travel between
    // positions. A dot only until a heading is known.
    const heading = entry.bearing ?? entry.moveBearing;
    ctx.fillStyle = withAlpha(color, opacity);
    ctx.beginPath();
    if (heading != null) {
      traceArrow(x, y, screenHeading(lat, lon, heading, x, y), radius);
    } else {
      ctx.arc(x, y, radius, 0, Math.PI * 2);
    }
    ctx.fill();

    if (hoverActive && focused) {
      const dist = Math.hypot(x - hoverX, y - hoverY);
      if (dist <= radius + 6 && dist < hoveredDist) {
        hoveredKey = key;
        hoveredDist = dist;
      }
    }
  }

  ctx.restore();
  for (const key of toDelete) vehicles.delete(key);
  if (fittingCorners) drawCornerHandles();

  // Stops are checked only when no vehicle was hit (vehicles take priority
  // when a comet tail and a tiny stop marker happen to overlap) and only
  // when the layer is actually on -- no point hit-testing ~2,900 points for
  // a tooltip on an invisible layer.
  let hoveredStop = null;
  if (hoveredKey === null && hoverActive && (control.stops || control.stop_history || focusActive())) {
    let dist2 = Infinity;
    const lists = [];
    if (control.stop_history) lists.push(stopHistoryPositions); // first, so its entries win ties
    if (control.stops) lists.push(stopScreenPositions);
    if (focusActive()) lists.push(routeStopPositions);
    for (const list of lists) {
      for (const s of list) {
        const d = Math.hypot(s.x - hoverX, s.y - hoverY);
        if (d > STOP_HISTORY_RADIUS + 5) continue;
        // The timetable also lists "parent" stops (ids starting G) at the same
        // spot with no routes of their own; prefer the stand that has routes.
        const score = d + ((stopRoutes.get(s.id) || []).length ? 0 : 3);
        if (score < dist2) { hoveredStop = s; dist2 = score; }
      }
    }
  }
  updateHoverTooltip(hoveredKey, hoveredStop);
  const hoveredEntry = hoveredKey !== null ? vehicles.get(hoveredKey) : null;
  setHoverRoutes(hoveredEntry ? [hoveredEntry.route_short_name].filter(Boolean)
    : hoveredStop ? (stopRoutes.get(hoveredStop.id) || []) : []);

  if (control.hud) {
    const n = control.nudge;
    const modeFlags = [
      calibrateMode ? "CALIBRATING" : null,
      fittingCorners ? "FITTING CORNERS" : (warpIsIdentity(control.warp) ? null : "CORNERS"),
      verificationMode ? "VERIFY" : null,
      n.dx || n.dy || n.scale !== 1 ? `NUDGE ${n.dx},${n.dy} x${n.scale.toFixed(3)}` : null,
    ].filter(Boolean);
    const when = playback.mode === "replay"
      ? `REPLAY ${playback.label} @ ${new Date(playback.t * 1000).toLocaleTimeString("en-AU", { timeZone: "Australia/Sydney" })} x${playback.speed}${playback.paused ? " PAUSED" : ""}`
      : "LIVE";
    statusEl.textContent = `Inner Sydney Transit Projection Model  |  ${when}  |  ${vehicles.size} vehicles  |  ${wsStatus}` +
      (modeFlags.length ? `  |  ${modeFlags.join(" ")}` : "");
  }
}

function withAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${Math.max(0, Math.min(1, alpha))})`;
}

// --- Calibration mode (Phase 5) -------------------------------------------
// Draggable crosshairs recording (pixel_x, pixel_y) paired with a
// hand-entered (lat, lon) for each physical registration mark, per the
// brief. "Save calibration" POSTs the correspondences to the server, which
// computes the homography and persists it; the renderer then switches to
// using it via selectProjector().

let calibrateMode = false;
let verificationMode = false;
let calibrationPoints = []; // {lat, lon, pixel_x, pixel_y}, lat/lon nullable until entered
let draggingPointIndex = null;

function defaultCalibrationPoints() {
  const m = 0.1;
  // Right-side default x is pulled in past the calibration panel's width
  // (see #calibration-panel CSS) so a fresh crosshair doesn't spawn hidden
  // underneath it.
  const rightX = Math.min(canvas.width * (1 - m), canvas.width - 300);
  return [
    { lat: null, lon: null, pixel_x: canvas.width * m, pixel_y: canvas.height * m },
    { lat: null, lon: null, pixel_x: rightX, pixel_y: canvas.height * m },
    { lat: null, lon: null, pixel_x: canvas.width * m, pixel_y: canvas.height * (1 - m) },
    { lat: null, lon: null, pixel_x: rightX, pixel_y: canvas.height * (1 - m) },
  ];
}

function enterCalibrateMode() {
  calibrateMode = true;
  document.body.classList.add("calibrating");
  document.getElementById("calibration-panel").classList.add("active");
  if (calibration && calibration.points && calibration.points.length) {
    calibrationPoints = calibration.points.map((p) => ({ lat: p.lat, lon: p.lon, pixel_x: p.pixel_x, pixel_y: p.pixel_y }));
  } else if (calibrationPoints.length === 0) {
    calibrationPoints = defaultCalibrationPoints();
  }
  renderCalibrationPanel();
}

function exitCalibrateMode() {
  calibrateMode = false;
  document.body.classList.remove("calibrating");
  document.getElementById("calibration-panel").classList.remove("active");
}

function renderCalibrationPanel() {
  const container = document.getElementById("calibration-points");
  container.innerHTML = "";
  calibrationPoints.forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "point-row";
    const label = document.createElement("span");
    label.textContent = String(i + 1);
    const latInput = document.createElement("input");
    latInput.type = "number"; latInput.step = "0.00001"; latInput.placeholder = "lat";
    latInput.value = p.lat ?? "";
    latInput.oninput = () => { p.lat = latInput.value === "" ? null : parseFloat(latInput.value); };
    const lonInput = document.createElement("input");
    lonInput.type = "number"; lonInput.step = "0.00001"; lonInput.placeholder = "lon";
    lonInput.value = p.lon ?? "";
    lonInput.oninput = () => { p.lon = lonInput.value === "" ? null : parseFloat(lonInput.value); };
    row.appendChild(label);
    row.appendChild(latInput);
    row.appendChild(lonInput);
    container.appendChild(row);
  });
}

function drawCalibrationCrosshairs() {
  calibrationPoints.forEach((p, i) => {
    const x = p.pixel_x, y = p.pixel_y;
    ctx.strokeStyle = i === draggingPointIndex ? "#ff2d9c" : "#5cf7ff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - 14, y); ctx.lineTo(x + 14, y);
    ctx.moveTo(x, y - 14); ctx.lineTo(x, y + 14);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, 14, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = "#5cf7ff";
    ctx.font = "11px ui-monospace, monospace";
    ctx.fillText(String(i + 1), x + 18, y - 10);
  });
}

function hitTestCalibrationPoint(x, y) {
  for (let i = calibrationPoints.length - 1; i >= 0; i--) {
    const p = calibrationPoints[i];
    if (Math.hypot(p.pixel_x - x, p.pixel_y - y) <= 16) return i;
  }
  return null;
}

canvas.addEventListener("mousedown", (ev) => {
  if (!calibrateMode) return;
  draggingPointIndex = hitTestCalibrationPoint(ev.offsetX, ev.offsetY);
});
canvas.addEventListener("mousemove", (ev) => {
  if (!calibrateMode || draggingPointIndex === null) return;
  calibrationPoints[draggingPointIndex].pixel_x = ev.offsetX;
  calibrationPoints[draggingPointIndex].pixel_y = ev.offsetY;
});
window.addEventListener("mouseup", () => { draggingPointIndex = null; });

// --- Corner fit --------------------------------------------------------------
// Drag each corner of the footprint onto the matching corner of the model.
// The map follows live while dragging (rebuilt at most once a frame); the
// offset goes to the server on release, which saves it with the nudge and
// sends it to every page. Fine moves are on the tablet's arrow pad.

let fittingCorners = false;
let unwarpedProjector = null; // calibration + nudge, before the corner warp
let dragWarp = null;          // local warp while a corner is being dragged
let draggingCorner = null;    // index into WARP_CORNERS
let cornerDragDirty = false;
const CORNER_HIT_PX = 24;
const CORNER_LABELS = ["NW", "NE", "SE", "SW"];

function drawCornerHandles() {
  const pts = footprintCorners(projector);
  ctx.save();
  ctx.strokeStyle = "#5cf7ff";
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  pts.forEach(([x, y], i) => { if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
  ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = "12px ui-monospace, monospace";
  pts.forEach(([x, y], i) => {
    ctx.strokeStyle = ctx.fillStyle = i === draggingCorner ? "#ff2d9c" : "#5cf7ff";
    ctx.beginPath();
    ctx.arc(x, y, 12, 0, Math.PI * 2);
    ctx.moveTo(x - 18, y); ctx.lineTo(x + 18, y);
    ctx.moveTo(x, y - 18); ctx.lineTo(x, y + 18);
    ctx.stroke();
    ctx.fillText(CORNER_LABELS[i], x + 16, y + (i < 2 ? 22 : -12));
  });
  ctx.restore();
}

canvas.addEventListener("mousedown", (ev) => {
  if (!fittingCorners || !projector) return;
  const pts = footprintCorners(projector);
  let best = null, bestDist = CORNER_HIT_PX;
  pts.forEach(([x, y], i) => {
    const d = Math.hypot(x - ev.offsetX, y - ev.offsetY);
    if (d <= bestDist) { best = i; bestDist = d; }
  });
  if (best === null) return;
  draggingCorner = best;
  dragWarp = JSON.parse(JSON.stringify(control.warp));
});
canvas.addEventListener("mousemove", (ev) => {
  if (draggingCorner === null || !unwarpedProjector) return;
  const src = footprintCorners(unwarpedProjector);
  const corner = WARP_CORNERS[draggingCorner];
  const next = { ...dragWarp, [corner]: [ev.offsetX - src[draggingCorner][0], ev.offsetY - src[draggingCorner][1]] };
  if (!isConvexQuad(warpedCorners(src, next))) return;
  dragWarp = next;
  cornerDragDirty = true;
});
window.addEventListener("mouseup", () => {
  if (draggingCorner === null) return;
  const corner = WARP_CORNERS[draggingCorner];
  draggingCorner = null;
  sendControl({ warp: { [corner]: dragWarp[corner].map((v) => Math.round(v * 2) / 2) } });
});

// Dev-only hover tracking -- separate listener from the calibration one
// above (both fire independently; this one runs whenever the pointer moves
// over the canvas at all, calibrating or not, and the render loop itself
// decides whether to act on it via hoverActive).
canvas.addEventListener("mousemove", (ev) => {
  hoverX = ev.offsetX;
  hoverY = ev.offsetY;
});
canvas.addEventListener("mouseleave", () => {
  hoverX = null;
  hoverY = null;
});

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

// TfNSW's predicted delay at the vehicle's next stop, in seconds (+ = late).
function formatDelay(sec) {
  if (sec === null || sec === undefined) return null;
  if (sec === 0) return "on schedule";
  const abs = Math.abs(sec);
  const m = Math.floor(abs / 60);
  const s = abs % 60;
  return `${m ? `${m} min ` : ""}${s}s ${sec > 0 ? "late" : "early"}`;
}

function updateHoverTooltip(key, stop) {
  const entry = key !== null ? vehicles.get(key) : null;
  if (!entry && !stop) {
    hoverTooltipEl.hidden = true;
    return;
  }
  let parts;
  if (entry) {
    const route = entry.route_short_name || entry.mode;
    parts = [`<div class="route">${route}</div>`, `<div class="muted">${entry.mode}</div>`];
    const hiddenEarly = entry.adherence === "early" && !control.early_buses;
    parts.push(`<div>${ADHERENCE_LABEL[entry.adherence] || "No schedule data"}${hiddenEarly ? " (shown as on time)" : ""}</div>`);
    const delayText = formatDelay(entry.deviation);
    if (delayText) parts.push(`<div>Delay: ${delayText}</div>`);
    if (entry.cg !== null && entry.cg !== undefined) {
      parts.push(`<div>Traffic: ${CONGESTION_LABEL[Math.round(entry.cg)] || "?"}</div>`);
    }
    if (entry.oc !== null && entry.oc !== undefined) {
      parts.push(`<div>Crowding: ${CROWDING_LABEL[Math.round(entry.oc)] || "?"}</div>`);
    }
  } else {
    parts = [`<div class="route">${escapeHtml(stop.name)}</div>`];
    const allRoutes = stopRoutes.get(stop.id) || [];
    if (allRoutes.length && !focusActive()) {
      const shown = allRoutes.slice(0, 12).join(", ") + (allRoutes.length > 12 ? ` +${allRoutes.length - 12} more` : "");
      parts.push(`<div class="muted">Routes: ${escapeHtml(shown)}</div>`);
    }
    if (focusActive()) {
      const serving = control.routes.filter((n) => routeDetails[n] && routeDetails[n].stop_ids.includes(stop.id));
      if (serving.length) parts.push(`<div class="muted">On route ${escapeHtml(serving.join(", "))}</div>`);
    }
    const h = stop.history || (control.stop_history && stopHistory ? stopHistory[stop.id] : null);
    if (h) {
      parts.push(`<div class="muted">${h.visits} vehicle visits recorded</div>`);
      if (h.delay_visits >= STOP_HISTORY_MIN_VISITS) {
        parts.push(`<div>Median delay on arrival: ${formatDelay(h.median_delay_s)}</div>`);
        parts.push(`<div>Average delay on arrival: ${formatDelay(h.mean_delay_s)}</div>`);
      } else {
        parts.push(`<div class="muted">Delay: only ${h.delay_visits} visits had a live prediction</div>`);
      }
      if (h.crowding_visits >= STOP_HISTORY_MIN_VISITS) {
        parts.push(`<div>Arrive with few seats or fuller: ${Math.round(h.crowded_share * 100)}%</div>`);
      } else {
        parts.push(`<div class="muted">Crowding: only ${h.crowding_visits} visits reported it</div>`);
      }
      const stat = control.stop_metric === "mean" ? "mean" : "median";
      const seated = h[`${stat}_delay_seated_s`];
      const crowded = h[`${stat}_delay_crowded_s`];
      if (seated !== null && crowded !== null) {
        const word = stat === "mean" ? "Average" : "Median";
        parts.push(`<div>${word} delay when seats available: ${formatDelay(seated)}</div>`);
        parts.push(`<div>${word} delay when crowded: ${formatDelay(crowded)}</div>`);
      }
    }
  }
  hoverTooltipEl.innerHTML = parts.join("");
  hoverTooltipEl.hidden = false;
  // hoverX/hoverY are canvas-relative (offsetX/offsetY); #hover-tooltip is
  // position:fixed (viewport-relative), so convert via the canvas's own
  // rect rather than assuming the canvas starts at the viewport origin.
  // Offset from the cursor so the tooltip doesn't sit directly under it
  // (which would immediately re-trigger mousemove/mouseleave churn).
  const rect = canvas.getBoundingClientRect();
  hoverTooltipEl.style.left = `${rect.left + hoverX + 14}px`;
  hoverTooltipEl.style.top = `${rect.top + hoverY + 14}px`;
}

document.getElementById("cal-add").addEventListener("click", () => {
  calibrationPoints.push({ lat: null, lon: null, pixel_x: canvas.width / 2, pixel_y: canvas.height / 2 });
  renderCalibrationPanel();
});
document.getElementById("cal-reset").addEventListener("click", () => {
  calibrationPoints = defaultCalibrationPoints();
  renderCalibrationPanel();
});
function showCalMessage(text, isError) {
  const el = document.getElementById("cal-message");
  el.textContent = text;
  el.className = isError ? "error" : "ok";
}

document.getElementById("cal-save").addEventListener("click", async () => {
  const valid = calibrationPoints.filter(
    (p) => p.lat !== null && p.lon !== null && !Number.isNaN(p.lat) && !Number.isNaN(p.lon)
  );
  if (valid.length < 4) {
    showCalMessage(`Need at least 4 points with lat/lon filled in (have ${valid.length}).`, true);
    return;
  }
  const resp = await fetch("/calibration", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ points: valid, canvas_width: canvas.width, canvas_height: canvas.height }),
  });
  const body = await resp.json();
  if (!resp.ok) {
    showCalMessage(`Calibration failed: ${body.error || resp.status}`, true);
    return;
  }
  calibration = body;
  rebuildLayers(); // the server also resets the nudge and ends calibration mode
  showCalMessage(`Calibration saved (${valid.length} points, ${body.computed_at}).`, false);
});

// Keyboard backup for the team; the tablet controller is the main way in.
// Every key sends a patch to the server rather than changing this page
// directly, so the tablet shows the same state.
//   C calibrate   V verification overlay   H status line   T theme   M background map (plain / detailed / full)
//   L dot colour (schedule / congestion / crowding)   E early buses on / off
//   A areas (off / jobs / service gap)   G areas on travel zones / 150m grid
//   Space pause / play a replay
//   1-5 trains / metro / light rail / buses / ferries
//   arrows nudge (shift = x10)   [ ] scale   0 reset nudge
const KEY_MODE_GROUPS = ["trains", "metro", "lightrail", "buses", "ferries"];
const LENSES = ["adherence", "congestion", "crowding"];
const AREA_LAYERS = ["none", "jobs", "service_gap"];
const BASEMAPS = ["plain", "detailed", "full"];
const nextOf = (list, current) => list[(list.indexOf(current) + 1) % list.length];
const NUDGE_STEP_PX = 2;
const SCALE_STEP = 0.002;

document.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "INPUT") return; // don't hijack typing lat/lon
  const key = ev.key.toLowerCase();
  const n = control.nudge;
  const step = NUDGE_STEP_PX * (ev.shiftKey ? 10 : 1);
  if (key === "c") sendControl({ calibrate: !control.calibrate });
  else if (key === "f") sendControl({ corners: !control.corners, calibrate: false });
  else if (key === "v") sendControl({ verify: !control.verify });
  else if (key === "h") sendControl({ hud: !control.hud });
  else if (key === "t") sendControl({ theme: control.theme === "dark" ? "light" : "dark" });
  else if (key === "m") sendControl({ basemap: nextOf(BASEMAPS, control.basemap) });
  else if (key === "s") sendControl({ stops: !control.stops });
  else if (key === "o") sendControl({ stop_history: !control.stop_history });
  else if (key === "l") sendControl({ lens: nextOf(LENSES, control.lens) });
  else if (key === "e") sendControl({ early_buses: !control.early_buses });
  else if (key === "a") sendControl({ area_layer: nextOf(AREA_LAYERS, control.area_layer) });
  else if (key === "g") sendControl({ area_unit: control.area_unit === "zones" ? "grid" : "zones" });
  else if (key === " " && control.playback && control.playback.session !== "live") {
    sendControl({ playback: { paused: !control.playback.paused } });
  }
  else if (key >= "1" && key <= "5") {
    const group = KEY_MODE_GROUPS[Number(key) - 1];
    sendControl({ modes: { [group]: control.modes[group] === false } });
  }
  else if (key === "arrowleft") sendControl({ nudge: { dx: n.dx - step } });
  else if (key === "arrowright") sendControl({ nudge: { dx: n.dx + step } });
  else if (key === "arrowup") sendControl({ nudge: { dy: n.dy - step } });
  else if (key === "arrowdown") sendControl({ nudge: { dy: n.dy + step } });
  else if (key === "[") sendControl({ nudge: { scale: n.scale - SCALE_STEP } });
  else if (key === "]") sendControl({ nudge: { scale: n.scale + SCALE_STEP } });
  else if (key === "0") sendControl({ nudge: { dx: 0, dy: 0, scale: 1 } });
  else return;
  ev.preventDefault();
});

let wsStatus = "connecting...";
let ws = null;

function connectWebSocket() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen = () => { wsStatus = "live"; };
  ws.onclose = () => { wsStatus = "reconnecting..."; setTimeout(connectWebSocket, 1000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    const frame = JSON.parse(ev.data);
    if (frame.control) { applyControl(frame.control); return; }
    if (frame.control_error) { console.warn("control rejected:", frame.control_error); return; }
    if (frame.epoch !== epoch) {
      epoch = frame.epoch;
      vehicles.clear();
    }
    if (frame.playback) setPlayback(frame.playback);
    applyFrame(frame.vehicles);
  };
}

async function boot() {
  const [cfgResp, shapesResp, calResp, stopsResp] = await Promise.all([
    fetch("/config"), fetch("/shapes"), fetch("/calibration"), fetch("/stops"),
  ]);
  cfg = await cfgResp.json();
  for (const [group, modes] of Object.entries(cfg.mode_groups || {})) {
    for (const mode of modes) modeToGroup[mode] = group;
  }
  shapes = await shapesResp.json();
  calibration = await calResp.json(); // null if none saved yet -- Phase 4's linear fit is used
  stops = await stopsResp.json();
  stopRoutes = new Map(stops.map((s) => [s.id, s.routes || []]));
  resize();
  loadAreas();
  connectWebSocket();
  requestAnimationFrame(render);
}

boot();
</script>
</body>
</html>
